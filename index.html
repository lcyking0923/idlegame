<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>조선검객 키우기</title>
<style>
:root{
  --ink:#16110C; --ink2:#221A11; --ink3:#2C2216;
  --paper:#F1E5C9; --paper2:#E6D5AD; --line:#C9B07C;
  --brown:#4A3823; --brown2:#7A6242;
  --red:#B93A2B; --red2:#93291D;
  --green:#3A6B52; --indigo:#31506E;
  --gold:#D9A441; --gold2:#B8842C; --goldL:#F2CE7B;
  --serif:'Gungsuh','GungsuhChe','Batang','BatangChe','AppleMyungjo','Noto Serif KR',serif;
  --sans:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:var(--sans);border:none;cursor:pointer;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
  background:var(--ink);box-shadow:0 0 60px rgba(0,0,0,.8);position:relative}
header{flex:none;background:var(--ink2);border-bottom:2px solid var(--gold2)}
.danchong{height:7px;background:repeating-linear-gradient(90deg,
  var(--red) 0 14px,var(--gold) 14px 18px,var(--green) 18px 32px,
  var(--gold) 32px 36px,var(--indigo) 36px 50px,var(--gold) 50px 54px);
  border-bottom:2px solid #0e0a06}
.hrow1{display:flex;align-items:center;gap:6px;padding:5px 8px 4px}
.profile{position:relative;width:44px;height:44px;flex:none;border-radius:10px;
  background:linear-gradient(#3A2C1B,#241B12);border:2px solid var(--gold2);font-size:22px;
  box-shadow:0 2px 5px rgba(0,0,0,.5)}
.profile .plv{position:absolute;left:-4px;bottom:-5px;background:var(--red);color:#FFF0DC;
  font-size:8.5px;font-weight:700;border-radius:8px;padding:1px 5px;border:1.5px solid #100C08}
.pnamew{flex:1;min-width:0;line-height:1.25}
.pname{font-size:12px;font-weight:700;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{font-size:10px;color:#BFA77E;white-space:nowrap}
#menuBtn{width:32px;height:32px;flex:none;border-radius:8px;background:var(--ink3);
  border:1px solid var(--brown2);font-size:16px;color:#CBB98F}
.expstrip{position:relative;height:11px;background:#0E0A06;border-top:1px solid #000;overflow:hidden}
.expstrip .fill{height:100%;background:linear-gradient(90deg,#2E7FA8,#5CC4E8);transition:width .3s}
.expstrip span{position:absolute;inset:0;text-align:center;font-size:8.5px;line-height:11px;color:#EAF6FF;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.hrow2{display:flex;gap:6px;padding:4px 10px 5px}
/* 스테이지 배너 */
#stageBanner{position:absolute;top:5px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;z-index:4}
#stageBanner .nav{width:24px;height:24px;border-radius:12px;background:rgba(14,10,6,.74);
  border:1px solid var(--brown2);color:var(--goldL);font-size:11px}
#stageBanner .nav.off{opacity:.3;pointer-events:none}
.sbname{background:linear-gradient(#3A2C1B,#241B12);border:1.5px solid var(--gold2);border-radius:6px;
  padding:2px 14px;text-align:center;line-height:1.15;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.sbname small{display:block;font-size:8px;letter-spacing:2px;color:var(--gold2)}
.sbname b{font-family:var(--serif);font-size:13px;color:var(--goldL);letter-spacing:1px;white-space:nowrap}
#bossBtn{width:38px;height:34px;border-radius:8px;background:linear-gradient(#4A2018,#2E120C);
  border:1.5px solid var(--red);color:#FFB4A0;font-size:14px;line-height:1;padding-top:2px}
#bossBtn small{display:block;font-size:7px;font-weight:700;letter-spacing:1px}
#bossBtn.ready{background:linear-gradient(#E06450,var(--red));color:#FFF0DC;border-color:var(--goldL);animation:pulse 1.2s infinite}
#bossBtn.off{filter:grayscale(.6);opacity:.6;pointer-events:none}
.killbar{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:210px;height:13px;z-index:4;
  background:#0E0A06;border:1.5px solid var(--gold2);border-radius:8px;overflow:visible}
.killbar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold2),var(--goldL));transition:width .3s}
.killbar .chest{position:absolute;right:-4px;top:-6px;font-size:11px;background:rgba(14,10,6,.85);
  border:1px solid var(--gold2);border-radius:9px;padding:1px 7px;color:#B6C9A8;font-variant-numeric:tabular-nums}
/* 스킬 슬롯 바 */
#skillbar{flex:none;display:flex;align-items:center;gap:5px;padding:5px 8px 2px;background:#120D08}
.skslots{flex:1;display:flex;gap:5px}
.skslot{position:relative;flex:1;aspect-ratio:1;max-width:46px;border-radius:9px;font-size:19px;
  background:linear-gradient(#2C2216,#1C150C);border:1.5px solid var(--brown2);color:#8F7C5C;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.skslot.filled{border-color:var(--gold2);background:linear-gradient(#3A2C1B,#241B12)}
.skslot.lockd{opacity:.4}
.skslot .cd{position:absolute;inset:0;background:rgba(10,7,4,.62);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#EAF6FF;font-variant-numeric:tabular-nums}
#autoSkBtn{width:44px;height:44px;flex:none;border-radius:9px;background:var(--ink3);border:1.5px solid var(--brown2);
  color:#8F7C5C;font-size:15px;line-height:1.1}
#autoSkBtn small{display:block;font-size:7.5px;font-weight:700;letter-spacing:1px}
#autoSkBtn.on{border-color:var(--gold2);color:var(--goldL);background:linear-gradient(#3A2C1B,#241B12)}
/* 모험 지도 */
.advmap{position:relative;height:330px;border-radius:12px;overflow:hidden;margin-bottom:8px;
  background:linear-gradient(160deg,#E8D5A8 0%,#DCC28E 45%,#CDb684 100%);border:2px solid var(--gold2)}
.advmap::before{content:'';position:absolute;inset:0;opacity:.25;
  background:radial-gradient(circle at 20% 30%,#B99A5E 0 2px,transparent 3px),
             radial-gradient(circle at 70% 60%,#B99A5E 0 2px,transparent 3px),
             radial-gradient(circle at 45% 80%,#B99A5E 0 2px,transparent 3px);background-size:90px 90px}
.advmap .mtitle{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-family:var(--serif);font-size:15px;letter-spacing:4px;color:#3A2A14;
  background:linear-gradient(#F5E7C2,#E8D5A8);border:1.5px solid #8A6E42;border-radius:4px;padding:2px 18px}
.mapnode{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.mapnode .mico{width:44px;height:44px;border-radius:50%;margin:0 auto;font-size:21px;line-height:42px;
  background:linear-gradient(#3A2C1B,#241B12);border:2px solid var(--gold2);color:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.4)}
.mapnode .mnm{margin-top:3px;background:rgba(20,14,8,.85);color:#F1E5C9;font-size:10px;font-weight:700;
  border-radius:4px;padding:2px 8px;white-space:nowrap;border:1px solid #6E5E44}
.mapnode .dot{position:absolute;top:-2px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #100C08}
/* 동료 무대 */
.compstage{display:flex;justify-content:space-around;align-items:flex-end;padding:14px 6px 10px;border-radius:12px;
  background:linear-gradient(#241C25 0%,#38273a 55%,#5B4530 56%,#4A3826 100%);border:2px solid var(--gold2);margin-bottom:8px}
.compfig{text-align:center;width:23%}
.compfig .clv{font-size:10px;color:var(--goldL);font-weight:700}
.compfig .cface{font-size:34px;line-height:1.15;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.compfig.lockd .cface{filter:grayscale(1) brightness(.4)}
.compfig .cnm{font-size:10px;color:#F1E5C9;font-weight:700}
.compfig .cbar{height:5px;border-radius:3px;background:#0E0A06;margin-top:3px;overflow:hidden}
.compfig .cbar i{display:block;height:100%;background:#5B8F72}
/* 출석 체크 */
.attgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.attcell{border-radius:8px;border:1.5px solid var(--line);background:linear-gradient(#FBF3DC,#EFE0BC);
  text-align:center;padding:4px 2px 5px;position:relative}
.attcell .d{font-size:8.5px;font-weight:700;background:#6E5E44;color:#F1E5C9;border-radius:3px;margin:-4px -2px 3px;padding:1px 0}
.attcell.big .d{background:var(--gold2)}
.attcell .rw{font-size:10px;font-weight:700;color:#33240F}
.attcell.done{opacity:.55}
.attcell.done::after{content:'✔';position:absolute;inset:0;font-size:22px;color:var(--red);
  display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #fff}
.attcell.today{outline:2px solid var(--red);outline-offset:1px}
/* 볼륨 슬라이더 */
.volrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.volrow .vic{width:34px;height:34px;flex:none;border-radius:8px;background:#FBF3DC;border:1px solid var(--line);
  font-size:17px;text-align:center;line-height:34px}
.volrow input[type=range]{flex:1;accent-color:var(--red)}
/* 소환 레벨 게이지 */
.sumlv{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:10px;color:#B8A47D}
.sumlv .bar{flex:1;height:8px;border-radius:5px;background:#1A130C;border:1px solid #6E5E44;overflow:hidden}
.sumlv .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--goldL))}
.cur{flex:1;display:flex;align-items:center;gap:6px;background:var(--ink3);
  border:1px solid var(--brown2);border-radius:9px;padding:3px 9px}
.cur b{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:13px;color:var(--paper);flex:1}
.cur .plus{width:17px;height:17px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;line-height:17px;text-align:center;flex:none}
.coin{width:17px;height:17px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,var(--goldL),var(--gold) 55%,var(--gold2));
  position:relative;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.coin::after{content:'';position:absolute;inset:5px;background:var(--ink3);border-radius:2px}
.jadeic{width:15px;height:15px;flex:none;border-radius:4px;transform:rotate(45deg);
  background:linear-gradient(135deg,#7FD6A8,#3A9B6E 60%,#22684A);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.6)}
#chips{position:absolute;top:60px;right:8px;z-index:6}
#chips span{display:block;margin-top:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;text-align:center}
.chip-boost{background:var(--red);color:#FFE9C2}
.chip-royal{background:var(--indigo);color:#DCE9F5}
/* 전장 */
#sceneWrap{flex:none;position:relative;border-bottom:2px solid var(--gold2);cursor:pointer}
#cv{display:block;width:100%;height:264px}
#stageBar{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:rgba(14,10,6,.74);border:1px solid var(--brown2);border-radius:20px;padding:3px 8px;font-size:12px;white-space:nowrap;z-index:4}
#stageBar b{font-family:var(--serif);color:var(--goldL);letter-spacing:1px;font-size:12px}
#stageBar .nav{width:26px;height:22px;border-radius:12px;background:var(--ink3);color:var(--goldL);font-size:12px;line-height:22px;text-align:center}
#stageBar .nav.off{opacity:.3;pointer-events:none}
#killsV{color:#B6C9A8;font-variant-numeric:tabular-nums;font-size:11px}
#autoBossBtn{position:absolute;top:36px;right:8px;background:rgba(14,10,6,.74);border:1px solid var(--brown2);
  border-radius:16px;padding:3px 9px;font-size:10px;font-weight:700;color:#CBB98F;z-index:4}
#autoBossBtn.on{color:var(--goldL);border-color:var(--gold2)}
#bossHud{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:74%;text-align:center;z-index:4}
#bossHud .bn{font-family:var(--serif);font-size:13px;color:#FFD9C2;text-shadow:0 1px 3px #000;letter-spacing:2px}
#bossHud .bar{height:10px;border:1px solid #000;border-radius:6px;background:#2A1512;overflow:hidden;margin-top:2px}
#bossHud .fill{height:100%;background:linear-gradient(90deg,#E06450,var(--red));width:100%}
#bossHud .bt{font-size:11px;color:#FFB;font-variant-numeric:tabular-nums}
#bossGo{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:4;
  background:linear-gradient(#E06450,var(--red));color:#FFF0DC;border:1.5px solid var(--goldL);
  border-radius:22px;padding:8px 20px;font-size:13px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.6);
  animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
#adBoostBtn{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 30%,#E8543F,var(--red) 60%,var(--red2));
  border:2px solid var(--goldL);color:#FFF3D9;font-size:9px;font-weight:700;line-height:1.15;
  box-shadow:0 3px 8px rgba(0,0,0,.55)}
#adBoostBtn.off{filter:grayscale(.85);opacity:.75}
#adBoostBtn .big{font-size:12px;display:block}
#questBtn,#mailBtn{position:absolute;left:8px;width:42px;height:42px;border-radius:50%;z-index:4;
  background:rgba(14,10,6,.78);border:2px solid var(--gold2);font-size:19px;
  box-shadow:0 3px 8px rgba(0,0,0,.55)}
#questBtn{bottom:8px}
#mailBtn{bottom:56px}
#questBtn .dot,#mailBtn .dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;
  background:var(--red);border:2px solid #100C08;display:none}
#questBtn .dot.on,#mailBtn .dot.on{display:block}
#gearBtn{width:30px;height:30px;border-radius:8px;background:var(--ink3);border:1px solid var(--brown2);font-size:15px}
.subtab{display:flex;gap:6px;margin:2px 0 7px}
.subtab button{flex:1;background:var(--ink3);border:1px solid var(--brown2);color:#CBB98F;
  border-radius:8px;padding:6px 0;font-size:12px;font-weight:700}
.subtab button.on{background:var(--red);color:#FFF0DC;border-color:var(--red2)}
.expbar{height:12px;border-radius:7px;background:#D8C9A4;border:1px solid var(--line);overflow:hidden;margin:5px 0}
.expbar .fill{height:100%;background:linear-gradient(90deg,var(--indigo),#5C87B5);transition:width .3s}
#tracker{flex:none;margin:5px 10px 0;padding:5px 11px;border-radius:10px;
  background:var(--ink3);border:1px solid var(--brown2);display:flex;align-items:center;gap:8px;
  font-size:11px;color:#E4D5B4;cursor:pointer}
#tracker.done{background:linear-gradient(90deg,#4A3512,#3A2A0E);border-color:var(--gold);color:var(--goldL)}
#tracker .qtxt{flex:1;line-height:1.3}
#tracker .qprog{flex:none;font-variant-numeric:tabular-nums;color:#BFA77E;font-size:10px}
main{flex:1;overflow:hidden;position:relative;margin-top:5px}
.panel{position:absolute;inset:0;overflow-y:auto;padding:2px 10px 16px;display:none;scrollbar-width:thin}
.panel.active{display:block}
.card{background:linear-gradient(var(--paper),var(--paper2));color:var(--brown);
  border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin-bottom:7px;
  box-shadow:0 2px 5px rgba(0,0,0,.45)}
.card h3{font-family:var(--serif);font-size:14px;color:#3A2A14;letter-spacing:1px;margin-bottom:4px}
.sect{font-family:var(--serif);font-size:12px;letter-spacing:3px;color:var(--gold);margin:11px 4px 6px;display:flex;align-items:center;gap:8px}
.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold2),transparent)}
.btn{border-radius:9px;font-weight:700;text-align:center;padding:7px 9px;
  background:linear-gradient(#F5D98A,var(--gold));color:#4A3208;border:1px solid var(--gold2);
  box-shadow:0 2px 0 var(--gold2);font-size:12px;line-height:1.3}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--gold2)}
.btn.off{background:#CBBFa6;color:#8B7f68;border-color:#B3A688;box-shadow:0 2px 0 #B3A688;pointer-events:none}
.btn.red{background:linear-gradient(#E06450,var(--red));color:#FFF0DC;border-color:var(--red2);box-shadow:0 2px 0 var(--red2)}
.btn.green{background:linear-gradient(#5B8F72,var(--green));color:#EDF5E8;border-color:#2C523F;box-shadow:0 2px 0 #2C523F}
.btn.wide{display:block;width:100%;margin-top:6px}
.small{font-size:11px;color:var(--brown2)}
.buybar{display:flex;gap:6px;margin:2px 0 7px}
.buybar button{flex:1;background:var(--ink3);border:1px solid var(--brown2);color:#CBB98F;
  border-radius:8px;padding:5px 0;font-size:12px;font-weight:700}
.buybar button.on{background:var(--gold);color:#3A2A0E;border-color:var(--gold2)}
.strow{display:flex;align-items:center;gap:9px}
.strow .ico{width:38px;height:38px;flex:none;border-radius:10px;font-size:21px;text-align:center;line-height:38px;
  background:linear-gradient(#FBF3DC,#EFE0BC);border:1px solid var(--line)}
.strow .mid{flex:1;min-width:0}
.strow .nm{font-family:var(--serif);font-size:13px;font-weight:700;color:#33240F}
.strow .nm .lv{color:var(--red);font-size:11px;margin-left:4px}
.strow .vv{font-size:11px;color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.strow .sub{font-size:10px;color:var(--brown2)}
.strow .btn{width:102px;flex:none;padding:5px 6px;font-size:11px}
.strow .btn b{font-size:12px;display:block;font-variant-numeric:tabular-nums}
.strow.locked{opacity:.75}
.togglebar{display:flex;gap:6px;margin-bottom:7px}
.togglebar button{flex:1;background:var(--ink3);border:1px solid var(--brown2);color:#CBB98F;border-radius:8px;padding:6px 0;font-size:11px;font-weight:700}
.togglebar button.on{background:var(--green);color:#EDF5E8;border-color:#2C523F}
.prest{background:linear-gradient(#2E2317,#241B12);border:1.5px solid var(--gold2);color:var(--paper)}
.prest h3{color:var(--goldL)}
.prest .small{color:#B8A47D}
.gachabox{text-align:center;background:linear-gradient(#3A2C1B,#241B12);border:1.5px solid var(--gold2);color:var(--paper)}
.gachabox h3{color:var(--goldL)}
.gachabox .small{color:#B8A47D}
.gachabox .row{display:flex;gap:8px;margin-top:7px}
.gachabox .btn{flex:1}
.relgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.rel{border-radius:10px;padding:6px 3px 5px;text-align:center;background:linear-gradient(#FBF3DC,#EFE0BC);
  border:2px solid var(--line);min-height:72px;position:relative}
.rel .e{font-size:21px;line-height:1.2}
.rel .n{font-size:9.5px;font-weight:700;color:#33240F;line-height:1.2;margin-top:2px}
.rel .v{font-size:9px;color:var(--indigo);font-weight:700}
.rel.r1{border-color:#5C87B5}.rel.r2{border-color:#7A5CB5;background:linear-gradient(#F5EFFB,#E6DCF3)}
.rel.r3{border-color:#B5722A;background:linear-gradient(#FDF3D8,#F3DFAE)}
.rel.r4{border-color:var(--red);background:linear-gradient(#FFF0E2,#F7DDC2);box-shadow:0 0 8px rgba(185,58,43,.45)}
.rel.r5{border-color:#C23A6E;background:linear-gradient(#FFEAF2,#F7CFDD);box-shadow:0 0 10px rgba(194,58,110,.5)}
.rel.r6{border-color:var(--gold);background:linear-gradient(#FFF6DC,#F5E3B0);box-shadow:0 0 12px rgba(217,164,65,.7)}
.rel.no{filter:grayscale(1);opacity:.5}
.rel.eq::after{content:'장착';position:absolute;top:-6px;right:-4px;background:var(--green);color:#fff;font-size:8px;font-weight:700;border-radius:8px;padding:1px 5px}
.rar0{color:#7A8A6E}.rar1{color:#5C87B5}.rar2{color:#7A5CB5}.rar3{color:#B5722A}.rar4{color:var(--red)}.rar5{color:#C23A6E}.rar6{color:#B8842C}
.slotrow{display:flex;gap:7px;margin-bottom:7px}
.slot{flex:1;aspect-ratio:1;border-radius:12px;border:2px dashed var(--brown2);background:var(--ink3);

<script>
'use strict';
/* ═══════════ 유틸 ═══════════ */
const $=id=>document.getElementById(id);
const UNITS=[['극',1e48],['재',1e44],['정',1e40],['간',1e36],['구',1e32],['양',1e28],['자',1e24],['해',1e20],['경',1e16],['조',1e12],['억',1e8],['만',1e4]];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<0) return '-'+fmt(-n);
  if(n<1e4) return Math.floor(n).toLocaleString('ko-KR');
  for(const [u,v] of UNITS){ if(n>=v){ const q=n/v; return (q>=100?Math.floor(q).toLocaleString('ko-KR'):q.toFixed(q>=10?1:2))+u; } }
}
function fmtTime(ms){
  const s=Math.max(0,Math.ceil(ms/1000));
  if(s<60) return s+'초';
  const m=Math.floor(s/60),h=Math.floor(m/60);
  if(h>0) return h+'시간 '+(m%60)+'분';
  return m+'분 '+(s%60)+'초';
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('toasts').appendChild(t);setTimeout(()=>t.remove(),2700);
}
let modalQueue=[];
let curStory=null, storyIdx=0;
function queueStory(st){ queueModal(()=>{ curStory=st; storyIdx=0; renderStory(); }); }
function renderStory(){
  const st=curStory; if(!st) return;
  const ln=st.lines[storyIdx];
  showModal(`<h2>${st.t}</h2>
    <div class="card" style="min-height:104px">
      ${ln[0]?`<div style="font-family:var(--serif);font-weight:700;color:var(--red);margin-bottom:4px;letter-spacing:2px">${ln[0]}</div>`:''}
      <p style="font-size:13px;line-height:1.8;${ln[0]?'':'font-style:italic;color:var(--brown2)'}">${ln[1]}</p>
    </div>
    <div class="small" style="text-align:center">${storyIdx+1} / ${st.lines.length}</div>
    <button class="btn red wide" data-a="storynext">${storyIdx<st.lines.length-1?'▶ 계속':'⚔️ 검을 든다'}</button>`);
}
function storyNext(){
  storyIdx++;
  if(!curStory||storyIdx>=curStory.lines.length){ curStory=null; closeModal(); }
  else renderStory();
}
function checkStory(){
  for(const st of STORY){
    if(st.at<9000&&!S.storySeen.includes(st.id)&&S.maxClear+1>=st.at){
      S.storySeen.push(st.id); queueStory(st); return;
    }
  }
}
function showModal(html){ $('modal').innerHTML=html; $('overlay').hidden=false; }
function closeModal(){
  $('overlay').hidden=true; $('modal').innerHTML='';
  if(typeof openSheet!=='undefined') openSheet=null;
  if(modalQueue.length){ modalQueue.shift()(); }
}
function queueModal(fn){ if($('overlay').hidden&&!modalQueue.length) fn(); else modalQueue.push(fn); }
/* ═══ 사운드 엔진: WebAudio 합성 (노이즈 스윕·임팩트·리버브·컴프레서) ═══ */
let AC=null,MASTER=null,SFX=null,MUS=null,RVB=null,NOISE=null;
const _plucks={},_sndLast={};
function ensureAudio(){
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createDynamicsCompressor();
      MASTER.threshold.value=-16; MASTER.knee.value=18; MASTER.ratio.value=6;
      MASTER.attack.value=0.003; MASTER.release.value=0.2;
      MASTER.connect(AC.destination);
      SFX=AC.createGain(); SFX.gain.value=(S&&S.volS!=null)?S.volS:0.6; SFX.connect(MASTER);
      MUS=AC.createGain(); MUS.gain.value=((S&&S.volM!=null)?S.volM:0.5)*0.6; MUS.connect(MASTER);
      RVB=AC.createConvolver(); RVB.buffer=makeIR(1.7,2.8);
      const rg=AC.createGain(); rg.gain.value=0.32; RVB.connect(rg); rg.connect(MASTER);
      NOISE=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
      const nd=NOISE.getChannelData(0);
      for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function makeIR(dur,decay){
  const sr=AC.sampleRate,len=Math.floor(sr*dur),buf=AC.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){
    const d=buf.getChannelData(c);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
  }
  return buf;
}
function panBus(pan,dest){
  dest=dest||SFX;
  if(!pan||!AC.createStereoPanner) return dest;
  const p=AC.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,pan));
  p.connect(dest); return p;
}
function envG(t0,a,peak,d,dest){
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
  g.connect(dest); return g;
}
function swish(t0,{f0=1100,f1=5400,fEnd=0,q=2.1,a=0.02,d=0.09,g=0.4,dest}={}){
  // 날카로운 칼바람: 고음역 대역 스윕 (샥~샤악)
  const n=AC.createBufferSource(); n.buffer=NOISE; n.loop=true;
  n.playbackRate.value=1.15+Math.random()*0.5;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=q;
  f.frequency.setValueAtTime(f0,t0);
  f.frequency.exponentialRampToValueAtTime(f1,t0+a+d*0.45);
  if(fEnd) f.frequency.exponentialRampToValueAtTime(fEnd,t0+a+d);
  const gg=envG(t0,a,g,d,dest||SFX);
  n.connect(f); f.connect(gg);
  n.start(t0); n.stop(t0+a+d+0.15);
}
function noiseHit(t0,{f0=400,f1=2800,q=1,a=0.02,d=0.1,g=0.4,type='bandpass',dest}={}){
  const n=AC.createBufferSource(); n.buffer=NOISE; n.loop=true;
  n.playbackRate.value=0.8+Math.random()*0.4;
  const f=AC.createBiquadFilter(); f.type=type; f.Q.value=q;
  f.frequency.setValueAtTime(f0,t0);
  if(f1&&f1!==f0) f.frequency.exponentialRampToValueAtTime(f1,t0+a+d*0.7);
  const gg=envG(t0,a,g,d,dest||SFX);
  n.connect(f); f.connect(gg);
  n.start(t0); n.stop(t0+a+d+0.15);
}
function toneHit(t0,{type='sine',f0=170,f1=60,a=0.005,d=0.12,g=0.6,dest}={}){
  const o=AC.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(f0,t0);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t0+a+d);
  const gg=envG(t0,a,g,d,dest||SFX);
  o.connect(gg); o.start(t0); o.stop(t0+a+d+0.1);
}
function metalRing(t0,freqs,d,g,dest,rvb){
  for(const f of freqs){
    const o=AC.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(f*(0.99+Math.random()*0.02),t0);
    const gg=envG(t0,0.004,g/freqs.length,d,dest||SFX);
    o.connect(gg);
    if(rvb&&RVB){ const s=AC.createGain(); s.gain.value=0.5; gg.connect(s); s.connect(RVB); }
    o.start(t0); o.stop(t0+d+0.1);
  }
}
function ksBuffer(freq){
  const sr=AC.sampleRate,N=Math.max(4,Math.round(sr/freq)),len=Math.floor(sr*1.1);
  const buf=AC.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const ring=new Float32Array(N);
  for(let i=0;i<N;i++) ring[i]=Math.random()*2-1;
  let idx=0;
  for(let i=0;i<len;i++){
    const cur=ring[idx],nxt=ring[(idx+1)%N];
    const v=0.995*0.5*(cur+nxt);
    d[i]=cur; ring[idx]=v; idx=(idx+1)%N;
  }
  return buf;
}
function pluck(t0,midi,g,dest,rvbAmt){
  const f=440*Math.pow(2,(midi-69)/12), key=Math.round(f*10);
  _plucks[key]=_plucks[key]||ksBuffer(f);
  const s=AC.createBufferSource(); s.buffer=_plucks[key];
  const gg=AC.createGain(); gg.gain.setValueAtTime(g,t0);
  s.connect(gg); gg.connect(dest||MUS);
  if(RVB&&rvbAmt){ const rs=AC.createGain(); rs.gain.value=rvbAmt; gg.connect(rs); rs.connect(RVB); }
  s.start(t0);
}
function snd(kind,pan){
  if(!S||!S.sound) return;
  if(!ensureAudio()) return;
  try{
    const T=AC.currentTime;
    const gap={hit:0.04,swing:0.05,coin:0.09,crit:0.06}[kind]||0;
    if(gap&&_sndLast[kind]&&T-_sndLast[kind]<gap) return;
    _sndLast[kind]=T;
    const dest=panBus(pan);
    if(kind==='swing'){ // 순수 칼바람 — 슥~ (실제 음원 파일 있으면 우선 사용)
      if(SFXF.play('swing',0.45)) return;
      swish(T,{f0:1300+Math.random()*300,f1:6800+Math.random()*800,fEnd:3200,q:2.8,
        a:0.035,d:0.14,g:0.5,dest});
      swish(T+0.01,{f0:2600,f1:8200,q:2.2,a:0.03,d:0.11,g:0.22,dest});
    }else if(kind==='hit'){ // 샥~ — 공기 가르는 스윕이 주역, 접촉은 가벼운 틱만
      if(SFXF.play('hit',0.5)){
        noiseHit(T+0.05,{f0:6500,f1:6500,q:1.2,a:0.002,d:0.02,g:0.1,type:'highpass',dest});
        return;
      }
      swish(T,{f0:1400+Math.random()*300,f1:6800+Math.random()*900,fEnd:3000,q:2.7,
        a:0.03,d:0.13,g:0.52,dest});
      swish(T+0.012,{f0:2800,f1:8500,q:2.2,a:0.025,d:0.1,g:0.24,dest}); // 고음 휘파람층
      noiseHit(T+0.05,{f0:6500,f1:6500,q:1.2,a:0.002,d:0.02,g:0.12,type:'highpass',dest}); // 접촉 틱
      if(Math.random()<0.25) metalRing(T+0.055,[3400+Math.random()*500,5100],0.05,0.07,dest);
    }else if(kind==='crit'){ // 샤아악~ — 길게 끌리는 예리한 스윕 + 금속 여운
      if(SFXF.play('crit',0.62)){
        metalRing(T+0.06,[2350,3520],0.15,0.16,dest,true);
        return;
      }
      swish(T,{f0:1100,f1:7600,fEnd:2800,q:2.6,a:0.03,d:0.19,g:0.58,dest});
      swish(T+0.015,{f0:2400,f1:9000,q:2.1,a:0.03,d:0.15,g:0.28,dest});
      noiseHit(T+0.06,{f0:7000,f1:7000,q:1.2,a:0.002,d:0.03,g:0.16,type:'highpass',dest});
      toneHit(T+0.06,{f0:140,f1:60,a:0.004,d:0.07,g:0.2,dest}); // 회심만 살짝 무게감
      metalRing(T+0.07,[2350,3520,4880],0.18,0.22,dest,true);
    }else if(kind==='coin'){
      metalRing(T,[2093,2637],0.09,0.16,dest);
      noiseHit(T,{f0:6500,f1:6500,q:2,a:0.003,d:0.04,g:0.08,type:'bandpass',dest});
    }else if(kind==='skill'){ // 기운 모으기 라이저
      noiseHit(T,{f0:260,f1:4200,q:1.6,a:0.16,d:0.14,g:0.35,dest});
      toneHit(T,{type:'sawtooth',f0:110,f1:330,a:0.14,d:0.12,g:0.12,dest});
      metalRing(T+0.2,[1760,2640],0.15,0.14,dest,true);
    }else if(kind==='boss'){ // 포효 + 북
      const sh=AC.createWaveShaper();
      const curve=new Float32Array(256);
      for(let i=0;i<256;i++){ const x=i/128-1; curve[i]=Math.tanh(3.5*x); }
      sh.curve=curve;
      const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
      const gg=envG(T,0.05,0.5,0.8,SFX);
      sh.connect(lp); lp.connect(gg);
      const rs=AC.createGain(); rs.gain.value=0.6; gg.connect(rs); rs.connect(RVB);
      for(const f of [58,44]){
        const o=AC.createOscillator(); o.type='sawtooth';
        o.frequency.setValueAtTime(f,T); o.frequency.exponentialRampToValueAtTime(f*0.55,T+0.8);
        o.connect(sh); o.start(T); o.stop(T+0.95);
      }
      noiseHit(T,{f0:160,f1:90,q:0.6,a:0.02,d:0.5,g:0.3,type:'lowpass'});
      toneHit(T,{f0:85,f1:38,a:0.006,d:0.3,g:0.9});
    }else if(kind==='reward'){ // 가야금 아르페지오
      [69,72,76,81].forEach((m,i)=>pluck(T+i*0.085,m,0.3,SFX,0.5));
    }else if(kind==='victory'){ // 승전 팡파르: 북 + 징 + 가야금 상행
      toneHit(T,{f0:70,f1:38,a:0.006,d:0.4,g:0.8});
      toneHit(T+0.16,{f0:82,f1:44,a:0.006,d:0.3,g:0.6});
      metalRing(T+0.05,[660,991,1320],0.9,0.5,null,true); // 징 여운
      [69,72,76,81,84].forEach((m,i)=>pluck(T+0.2+i*0.09,m,0.34,SFX,0.6));
      noiseHit(T,{f0:5000,f1:2000,q:0.8,a:0.01,d:0.35,g:0.18});
    }else if(kind==='lose'){
      toneHit(T,{type:'sawtooth',f0:200,f1:46,a:0.02,d:0.55,g:0.22});
      noiseHit(T,{f0:800,f1:120,q:0.8,a:0.03,d:0.5,g:0.2,type:'lowpass'});
      metalRing(T+0.1,[880,1320],0.4,0.1,null,true);
    }
  }catch(e){}
}
/* ═══ 배경음악: 국악풍 절차 생성 (가야금 KS현·북·장구·대금)
   평시(84BPM 평조) ↔ 전투(110BPM 긴박 변주)를 돌입 즉시 전환 ═══ */
const Music={
  on:false,iv:null,next:0,step:0,bar:0,mIdx:4,tense:false,sus:[],
  scale:[57,60,62,64,67,69,72,74,76,79], // A 펜타토닉 (평조 느낌)
  spb(){ return 60/(this.tense?110:84)/4; },
  start(){
    if(!S.music||this.iv||!ensureAudio()) return;
    this.on=true; this.tense=false; this.next=AC.currentTime+0.15; this.step=0; this.bar=0;
    this.iv=setInterval(()=>this.tick(),90);
  },
  stop(){
    this.on=false;
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.fadeSus();
  },
  fadeSus(){ // 예약된 지속음(드론·대금)을 즉시 페이드아웃
    if(!AC) return;
    const T=AC.currentTime;
    for(const s of this.sus){
      try{
        s.g.gain.cancelScheduledValues(T);
        s.g.gain.setValueAtTime(Math.max(s.g.gain.value,0.0001),T);
        s.g.gain.linearRampToValueAtTime(0.0001,T+0.25);
        s.o.stop(T+0.32);
        if(s.o2) s.o2.stop(T+0.32);
      }catch(e){}
    }
    this.sus=[];
  },
  setMode(t){ // 평시 ↔ 전투 즉시 전환
    this.tense=t;
    this.fadeSus();
    const T=AC.currentTime;
    this.step=0; this.bar=0; this.next=T+(t?0.14:0.4);
    if(t){ // 돌입 스팅: 북 연타 + 크래시
      toneHit(T,{f0:76,f1:38,a:0.005,d:0.3,g:0.65,dest:MUS});
      toneHit(T+0.15,{f0:66,f1:33,a:0.005,d:0.42,g:0.8,dest:MUS});
      noiseHit(T+0.15,{f0:4800,f1:1800,q:0.7,a:0.008,d:0.4,g:0.2,dest:MUS});
      pluck(T+0.3,45,0.3,MUS,0.4); pluck(T+0.39,44,0.26,MUS,0.4); // 반음 하강 불협 경고
    }
  },
  tick(){
    if(!this.on||!AC) return;
    try{
      const want=W.mode==='boss'||W.mode==='dungeon';
      if(want!==this.tense) this.setMode(want);
      const SPB=this.spb();
      while(this.next<AC.currentTime+0.28){
        this.schedule(this.step,this.next,SPB);
        this.step=(this.step+1)%32;
        if(this.step===0) this.bar++;
        this.next+=SPB;
      }
    }catch(e){}
  },
  drone(t,midis,dur,g0){
    for(const m of midis){
      const o=AC.createOscillator(); o.type='sine';
      o.frequency.value=440*Math.pow(2,(m-69)/12);
      const g=AC.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(g0,t+0.5);
      g.gain.setValueAtTime(g0,t+dur-0.6);
      g.gain.linearRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(MUS);
      o.start(t); o.stop(t+dur+0.05);
      this.sus.push({o,g});
    }
  },
  schedule(st,t,SPB){
    if(this.tense){ /* ── 전투: 몰아치는 패턴 ── */
      // 낮은 불안 드론 (A1 + E2, 반음 텐션은 필에서)
      if(st===0) this.drone(t,[33,40],32*SPB,0.05);
      // 저음 가야금 오스티나토 (8분음 드라이브)
      if(st%2===0) pluck(t,st%16===14?36:33,0.2,MUS,0.12);
      // 북: 정박 강타 + 당김음
      if(st%8===0) toneHit(t,{f0:88,f1:44,a:0.005,d:0.2,g:0.55,dest:MUS});
      if(st%8===6) toneHit(t,{f0:78,f1:46,a:0.005,d:0.12,g:0.32,dest:MUS});
      // 장구: 잦은 틱
      if(st%4===2) noiseHit(t,{f0:3800,f1:2800,q:2.3,a:0.002,d:0.045,g:0.11,dest:MUS});
      if(st%16===12) noiseHit(t,{f0:5200,f1:3600,q:2,a:0.002,d:0.06,g:0.13,dest:MUS});
      // 선율: 저음역에서 급박한 랜덤워크
      if(st%2===1&&Math.random()<0.42){
        const mv=[-2,-1,0,1,1,2][Math.floor(Math.random()*6)];
        this.mIdx=Math.max(0,Math.min(5,this.mIdx+mv));
        pluck(t,this.scale[this.mIdx]-12,0.24,MUS,0.2);
      }
      // 2마디마다 16분음 상승 필 (긴장 고조)
      if(st>=28&&(this.bar&1)) pluck(t,this.scale[st-28+2]-12,0.2,MUS,0.2);
    }else{ /* ── 평시: 은은한 평조 ── */
      if(st===0) this.drone(t,[45,52],32*SPB,0.045);
      if(st%16===0) toneHit(t,{f0:82,f1:44,a:0.006,d:0.22,g:0.5,dest:MUS});
      if(st%16===10) toneHit(t,{f0:74,f1:42,a:0.006,d:0.16,g:0.3,dest:MUS});
      if(st%8===4) noiseHit(t,{f0:3200,f1:2400,q:2.2,a:0.003,d:0.05,g:0.1,dest:MUS});
      if(st%2===0&&Math.random()<0.36){
        const mv=[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)];
        this.mIdx=Math.max(0,Math.min(this.scale.length-1,this.mIdx+mv));
        pluck(t,this.scale[this.mIdx],0.2+Math.random()*0.08,MUS,0.35);
        if(Math.random()<0.15) pluck(t+SPB*0.5,this.scale[Math.max(0,this.mIdx-1)],0.12,MUS,0.3);
      }
      if(st===16&&Math.random()<0.45){
        const m=this.scale[5+Math.floor(Math.random()*4)];
        const o=AC.createOscillator(); o.type='sine';
        const f=440*Math.pow(2,(m-69+12)/12);
        o.frequency.setValueAtTime(f,t);
        const lfo=AC.createOscillator(); lfo.frequency.value=4.6;
        const lg=AC.createGain(); lg.gain.value=f*0.011;
        lfo.connect(lg); lg.connect(o.frequency);
        const g=AC.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(0.05,t+0.5);
        g.gain.linearRampToValueAtTime(0.0001,t+8*SPB);
        o.connect(g); g.connect(MUS);
        const rs=AC.createGain(); rs.gain.value=0.7; g.connect(rs); rs.connect(RVB);
        o.start(t); o.stop(t+8*SPB+0.1);
        lfo.start(t); lfo.stop(t+8*SPB+0.1);
        this.sus.push({o,g,o2:lfo});
      }
    }
  }
};
/* ═══ 배경음악 파일 재생기 (assets/bgm/ 11곡)
   챕터 이동·보스 돌입·던전 입장을 200ms 폴링으로 감지해 0.8초 크로스페이드 전환.
   심연(2회차 루프)은 같은 필드곡을 0.94배 느리게(음정 하강) 변조.
   파일 로드 실패 시(파일 삭제 등) 기존 절차 생성 Music으로 영구 폴백 ═══ */
const BGM_SRC={
  field0:'assets/bgm/1.Twilight_by_the_River.mp3',       // 한양 근교
  field1:'assets/bgm/2.Wind_Over_Stone_Peaks.mp3',       // 백두대간
  field2:'assets/bgm/3.The_Current_Beneath.mp3',         // 서해 갯벌
  field3:'assets/bgm/4.Heartbeat_of_the_Pine_Grove.mp3', // 지리산 심곡
  field4:'assets/bgm/5.망자의_행렬.mp3',                  // 저승 문턱
  boss:'assets/bgm/6.Iron_Gate_Siege.mp3',               // 층 보스
  rankup:'assets/bgm/7.The_Bronze_Bell_Decree.mp3',      // 승급 시험관
  gold:'assets/bgm/8.Hundred_Coin_Scramble.mp3',         // 황금곳간
  trial:'assets/bgm/9.Before_the_March.mp3',             // 무과 시험장
  rift:'assets/bgm/10.Below_The_Iron_Rim.mp3',           // 심연 균열
  rebirth:'assets/bgm/11.Gate_of_the_Ascent.mp3',        // 전생 스팅어(단발)
};
const BGM={
  /* 1차: fetch+WebAudio 디코딩 재생 — <audio> 요소는 브라우저 미디어 정책(백그라운드 로드 유예 등)에
     막혀 무한 로딩에 빠질 수 있어서 쓰지 않는다. MUS 버스 경유라 BGM 볼륨 슬라이더도 그대로 적용.
     2차(file:// 등 fetch 불가): <audio> 요소. 3차(파일 없음/디코딩 실패): 절차 생성 Music. */
  on:false, wa:null, waVol:1.8, vol:0.55, failed:false, iv:null, seq:0,
  src:null, bufs:{}, loading:{}, pos:{},          // WebAudio 모드
  cur:null, curKey:null, tracks:{}, fades:[],     // 요소 모드
  key(){ // 지금 흘러야 할 트랙
    if(W.mode==='dungeon'&&W.dg) return BGM_SRC[W.dg.id]?W.dg.id:'boss';
    if(W.mode==='boss') return 'boss';
    return 'field'+(Math.floor((S.stage-1)/10)%CH.length);
  },
  fail(){
    if(this.failed) return;
    this.failed=true; this.stop();
    if(S&&S.music){ ensureAudio(); Music.start(); }
  },
  start(){
    if(!S||!S.music) return;
    if(this.failed){ Music.start(); return; }
    if(this.wa===null) this.wa=(location.protocol!=='file:'&&!!window.fetch&&!!ensureAudio());
    this.on=true;
    if(!this.iv) this.iv=setInterval(()=>this.tick(),60);
    if(this.wa) this.loadBuf('boss').catch(()=>{}); else this.get('boss'); // 보스곡 프리로드
    this.tick();
  },
  stop(){
    this.on=false;
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    if(this.src){ this.savePos(); const s=this.src,T=AC?AC.currentTime:0;
      try{ s.g.gain.cancelScheduledValues(T); s.g.gain.setValueAtTime(Math.max(s.g.gain.value,0.0001),T);
        s.g.gain.linearRampToValueAtTime(0.0001,T+0.2); s.o.stop(T+0.25); }catch(e){}
      this.src=null;
    }
    for(const k in this.tracks){ try{ this.tracks[k].pause(); }catch(e){} }
    this.fades=[]; this.cur=null; this.curKey=null;
  },
  tick(){
    if(!this.on||!S) return;
    const k=this.key();
    if(k!==this.curKey){ if(this.wa) this.swapWA(k); else this.swapEl(k); }
    if(this.wa) return; // WebAudio 크로스페이드는 게인 램프가 알아서 진행
    const spd=this.vol/0.8*0.06; // 요소 모드: 0.8초 크로스페이드, 60ms 스텝
    if(this.cur&&this.cur.volume<this.vol) this.cur.volume=Math.min(this.vol,this.cur.volume+spd);
    for(let i=this.fades.length-1;i>=0;i--){
      const a=this.fades[i];
      a.volume=Math.max(0,a.volume-spd);
      if(a.volume<=0){ try{ a.pause(); }catch(e){} this.fades.splice(i,1); }
    }
  },
  /* ── WebAudio 모드 ── */
  loadBuf(k){
    if(this.bufs[k]) return Promise.resolve(this.bufs[k]);
    if(!this.loading[k]) this.loading[k]=fetch(encodeURI(BGM_SRC[k]))
      .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
      .then(ab=>new Promise((res,rej)=>AC.decodeAudioData(ab,res,rej)))
      .then(b=>{ delete this.loading[k]; this.bufs[k]=b; this.trimBufs(k); return b; })
      .catch(e=>{ delete this.loading[k]; throw e; });
    return this.loading[k];
  },
  trimBufs(cur){ // 디코딩된 PCM은 곡당 ≈10MB — 최근 것만 유지 (모바일 메모리)
    const keep=[cur,this.curKey,'boss'];
    const ks=Object.keys(this.bufs).filter(k=>!keep.includes(k));
    while(ks.length>2) delete this.bufs[ks.shift()];
  },
  savePos(){ const s=this.src; if(s&&s.k.charAt(0)==='f'&&AC) this.pos[s.k]=s.off+(AC.currentTime-s.t0)*s.rate; },
  swapWA(k){
    if(this.src){ this.savePos(); const s=this.src,T=AC.currentTime; // 0.8초 페이드아웃
      try{ s.g.gain.cancelScheduledValues(T); s.g.gain.setValueAtTime(Math.max(s.g.gain.value,0.0001),T);
        s.g.gain.linearRampToValueAtTime(0.0001,T+0.8); s.o.stop(T+0.9); }catch(e){}
      this.src=null;
    }
    this.curKey=k; const my=++this.seq;
    this.loadBuf(k).then(b=>{
      if(!this.on||this.seq!==my) return;
      const o=AC.createBufferSource(); o.buffer=b; o.loop=(k!=='rebirth'); // 버퍼 루프 = 무결절
      const rate=(k.charAt(0)==='f'&&Math.floor((S.stage-1)/(CH.length*10))>0)?0.94:1; // 심연 변속
      o.playbackRate.value=rate;
      const g=AC.createGain(); o.connect(g); g.connect(MUS);
      const T=AC.currentTime;
      const off=(k.charAt(0)==='f'&&this.pos[k])?this.pos[k]%b.duration:0; // 필드는 이어듣기
      g.gain.setValueAtTime(0.0001,T); g.gain.linearRampToValueAtTime(this.waVol,T+0.8);
      o.start(T,off);
      this.src={o,g,k,t0:T,off,rate};
    }).catch(()=>this.fail());
  },
  /* ── 요소 모드 (file:// 폴백) ── */
  get(k){
    let a=this.tracks[k];
    if(!a){
      a=new Audio(encodeURI(BGM_SRC[k]));
      a.loop=(k!=='rebirth'); a.preload='auto'; a.volume=0;
      a.addEventListener('error',()=>this.fail());
      this.tracks[k]=a;
    }
    return a;
  },
  swapEl(k){
    if(this.cur&&this.fades.indexOf(this.cur)<0) this.fades.push(this.cur);
    const a=this.get(k);
    const j=this.fades.indexOf(a); if(j>=0) this.fades.splice(j,1);
    if(k.charAt(0)==='f'){ // 필드: 심연이면 느리고 어둡게, 이어듣기
      const abyss=Math.floor((S.stage-1)/(CH.length*10))>0;
      try{ a.preservesPitch=false; }catch(e){}
      a.playbackRate=abyss?0.94:1;
    }else{ a.playbackRate=1; a.currentTime=0; } // 전투곡: 매번 첫 박부터
    if(a.paused){ const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }
    this.cur=a; this.curKey=k;
  },
  sting(){ // 전생: 단발 스팅어를 얹고 현재 곡은 잠시 덕킹
    if(this.failed||!this.on) return;
    if(this.wa){
      this.loadBuf('rebirth').then(b=>{
        if(!this.on) return;
        const T=AC.currentTime;
        if(this.src){ const g=this.src.g.gain;

      }).catch(()=>{});

    }

/* ═══ 실제 칼소리 파일 재생기 (assets/sfx/) — 있으면 사용, 없으면 합성음 폴백
   지원 파일명: swing1~3, hit1~3, crit1~3 (.mp3/.wav/.ogg) — swing만 있어도 전체에 사용 ═══ */
const SFXF={
  /* BGM과 같은 이유로 fetch+WebAudio 디코딩이 1차 경로 — SFX 버스 경유라 효과음 볼륨 슬라이더도 적용.
     file://에서만 <audio> 요소 폴백. 둘 다 실패하면 play()가 false를 돌려 기존 합성음이 나온다. */
  files:{swing:[],hit:[],crit:[]}, bufs:{swing:[],hit:[],crit:[]}, inited:false, wa:false,
  init(){
    if(this.inited) return; this.inited=true;
    this.wa=(location.protocol!=='file:'&&!!window.fetch&&!!ensureAudio());
    for(const k of ['swing','hit','crit']){
      for(let i=1;i<=3;i++){
        for(const ext of ['mp3','wav','ogg']){
          const url='assets/sfx/'+k+i+'.'+ext;
          if(this.wa){
            fetch(url).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
              .then(ab=>new Promise((res,rej)=>AC.decodeAudioData(ab,res,rej)))
              .then(b=>this.bufs[k].push(b)).catch(()=>{});
          }else{
            const a=new Audio(url);
            a.preload='auto'; a.volume=0.5;
            a.addEventListener('canplaythrough',()=>{
              if(!this.files[k].includes(a)) this.files[k].push(a);
            },{once:true});
          }
        }
      }
    }
  },
  pool(kind){ // hit/crit 파일이 없으면 swing 파일로 대체
    const t=this.wa?this.bufs:this.files;
    if(t[kind].length) return t[kind];
    if(t.swing.length) return t.swing;
    return null;
  },
  play(kind,vol){
    const p=this.pool(kind); if(!p) return false;
    try{
      if(this.wa){
        if(!AC) return false;
        const o=AC.createBufferSource(); o.buffer=p[Math.floor(Math.random()*p.length)];
        o.playbackRate.value=0.92+Math.random()*0.16; // 매번 미세 변조
        const g=AC.createGain(); g.gain.value=(vol||0.5)*1.25;
        o.connect(g); g.connect(SFX); o.start();
        return true;
      }
      const src=p[Math.floor(Math.random()*p.length)];
      const a=src.cloneNode();
      a.volume=Math.min(1,vol||0.5);
      a.playbackRate=0.92+Math.random()*0.16;
      const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{});
      return true;
    }catch(e){ return false; }
  }
};
/* ═══ 주인공 스프라이트 (assets/sprites/hero.png)
   원화 시트에서 뽑은 23프레임 아틀라스. 프레임마다 발끝 앵커(ox,oy)를 담아 두어
   달리기·베기·쓰러짐 자세가 제각각이어도 지면선에 정확히 붙는다.
   도포 스킨은 남색 계열 픽셀만 런타임에 다시 칠해 캐시 — 아틀라스 1장으로 4벌 처리.
   로드 실패 시 ready가 false로 남아 기존 벡터 검객이 그대로 그려진다 ═══ */
const HeroSpr={
  img:null, F:null, sc:2, ready:false, tint:{},
  load(){
    fetch('assets/sprites/hero.json').then(r=>r.json()).then(d=>{
      const im=new Image();
      im.onload=()=>{ this.img=im; this.F=d.frames; this.sc=d.scale||2; this.ready=true; };
      im.src='assets/sprites/hero.png';
    }).catch(()=>{});
  },
  sheet(){
    const r=(S.skin&&S.skin.robe)||0;
    if(!r) return this.img;
    if(!this.tint[r]) this.tint[r]=this.retint((ROBES[r]||ROBES[0]).c1)||this.img;
    return this.tint[r];
  },
  retint(hex){ // 남색 도포 픽셀만 목표색으로 — 명암비는 원본 그대로 보존
    try{
      const im=this.img, c=document.createElement('canvas');
      c.width=im.width; c.height=im.height;
      const g=c.getContext('2d'); g.drawImage(im,0,0);
      const d=g.getImageData(0,0,c.width,c.height), p=d.data;
      const tr=parseInt(hex.slice(1,3),16),tg=parseInt(hex.slice(3,5),16),tb=parseInt(hex.slice(5,7),16);
      const mask=new Uint8Array(p.length>>2);
      let sum=0,n=0;
      for(let i=0,j=0;i<p.length;i+=4,j++){
        if(p[i+3]<60) continue;
        const r=p[i],gg=p[i+1],b=p[i+2];
        const mx=Math.max(r,gg,b),dl=mx-Math.min(r,gg,b);
        if(mx<1||dl<1) continue;
        if(dl/mx<0.17) continue;
        const v=mx/255; if(v<0.13||v>0.80) continue;
        let hu = mx===r ? (((gg-b)/dl)%6+6)%6 : mx===gg ? (b-r)/dl+2 : (r-gg)/dl+4;
        hu*=60;
        if(hu<195||hu>250) continue;
        mask[j]=1; sum+=r*0.299+gg*0.587+b*0.114; n++;
      }
      if(!n) return null;
      const ref=Math.max(1,sum/n);
      for(let i=0,j=0;i<p.length;i+=4,j++){
        if(!mask[j]) continue;
        const q=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)/ref;
        p[i]=Math.min(255,tr*q); p[i+1]=Math.min(255,tg*q); p[i+2]=Math.min(255,tb*q);
      }
      g.putImageData(d,0,0);
      return c;
    }catch(e){ return null; } // file://에서는 캔버스가 오염되어 읽기 불가 → 기본 도포로
  },
  pick(h){ // 상태 → [클립, 프레임]
    if(h.dead>0) return ['down', h.dead>2.1?0:1];         // 무릎 꿇음 → 쓰러짐
    if(h.swing>0){                                        // 준비 → 베기 → 마무리
      const p=Math.min(0.999,1-h.swing);
      return [h.swBig?'big':'atk', Math.floor(p*3)];      // 회심타·기술은 큰 검기 궤적
    }
    if(W.running) return ['run',Math.floor(h.run*7.5)%this.F.run.length];
    return ['idle',0];                                    // 칼 뽑은 기본 자세
  },
  draw(h){
    const pk=this.pick(h), arr=this.F[pk[0]];
    const f=arr&&arr[Math.min(pk[1],arr.length-1)];
    const sh=this.sheet();
    if(!f||!sh) return;
    const s=1/this.sc;
    // 달리기 프레임엔 상하 움직임이 이미 들어 있으므로 대기 중에만 숨쉬기 흔들림
    const bob=(h.dead>0||W.running)?0:Math.sin(W.t*2)*1.2;
    cx.drawImage(sh,f.x,f.y,f.w,f.h,
      Math.round(h.x-f.ox*s), Math.round(W.G-f.oy*s+bob), f.w*s, f.h*s);
  },
};

function stVal(id){ const c=STATS.find(s=>s.id===id); return c.f(S.st[id]); }
function rankMult(){ let m=1; for(let i=0;i<S.rank;i++) m*=RANK_MULTS[i]; return m; }
function nextRankMult(){ return S.rank<RANK_MULTS.length?RANK_MULTS[S.rank]:1; }
function wEqMult(){ if(S.wEq<0||!S.weapons[S.wEq]) return 1;
  const w=WEAPONS[S.wEq]; return 1+W_PCT[w.r]*(1+0.12*(S.weapons[S.wEq]-1))/100; }
function wOwnMult(){ let p=0; for(const id in S.weapons) p+=W_PCT[WEAPONS[id].r]*S.weapons[id]*0.15; return 1+p/100; }
function wEqCritD(){ if(S.wEq<0||!S.weapons[S.wEq]) return 0; // 레어 이상: 치명피해 %p
  return W_CD[WEAPONS[S.wEq].r]*(1+0.1*(S.weapons[S.wEq]-1)); }
function wEqGold(){ if(S.wEq<0||!S.weapons[S.wEq]) return 0; // 신화 이상: 냥 획득 %
  return W_GOLD[WEAPONS[S.wEq].r]*(1+0.1*(S.weapons[S.wEq]-1)); }

function heroAtk(){
  let a=stVal('atk')*rankMult()*wEqMult()*wOwnMult()*spMult()*(1+S.aw.atk*0.04)*trMult('atk')*(1+rankOptSum('atk')/100)*(1+compLv(1)*0.03);

  if(adbOn('atk')) a*=2;
  if(boostOn()) a*=2; if(royalOn()) a*=2;

}

  const base={hp:[5,12,28,65],gold:[4,10,22,50],exp:[4,10,22,50]}[kind];
  return base?base[r]*(1+0.1*(lv-1)):0;
}
/* 장신구/동료 보조 효과 */
function accFx(kind){ if(S.accEq<0||!S.accs[S.accEq]) return 0;
  const a=ACCS[S.accEq]; return (a.fx[kind]||0)*(1+0.1*(S.accs[S.accEq]-1)); }
function compLv(i){ return S.comp[i]||0; }
function compCost(i){ return 200*Math.pow(1.12,compLv(i))*Math.pow(8,i); }
function compUnlocked(i){ return S.maxClear>=COMPS[i].un; }
/* 명중/회피 (원작: 고층 요괴 회피 — 명중 스탯 필수) */
function enemyDodge(n){ return Math.min(35,(n-1)*0.12); }
function hitChance(n){ return Math.min(100,100-enemyDodge(n)+S.spSt.acc*0.2+compLv(0)*0.3); }
function heroDodge(){ return Math.min(40,S.spSt.eva*0.1); }
/* 스킬 숙련도 (원작: 스킬 20강마다 숙련도 → 전 스킬 피해 증가) */
function skillMastery(){ let t=0; for(const k in S.skills) t+=S.skills[k]; return Math.floor(t/20); }
function heroCrit(){ return Math.min(100,stVal('crit')+S.spSt.crit*0.1); }
function heroCritD(){ return stVal('critd')+S.aw.critd*6+wEqCritD()+accFx('cd'); }
function heroAps(){ let a=stVal('aps'); if(buffAps>0) a*=1+buffApsV; return a; }
function skillMult(i){ const lv=S.skills[i]||1;
  return SKILLS[i].mult*(1+0.15*(lv-1))*(1+S.aw.skill*0.05)*trMult('skill')*(1+skillMastery()*0.05)*(S.skAw[i]?1.8:1); }
function goldMult(){ return (1+stVal('gget')/100)*(1+wEqGold()/100)*(1+S.aw.gold*0.04)*trMult('gold')*(1+S.spSt.gold*0.02)*(1+spFx('gold')/100)*(1+accFx('gold')/100)*(1+rankOptSum('gold')/100)*(1+compLv(2)*0.03)*(adbOn('gold')?3:1)*(boostOn()?2:1)*(royalOn()?2:1); }
function statCost(id,k){ const c=STATS.find(s=>s.id===id); const lv=S.st[id];
  return c.c0*Math.pow(c.cg,lv)*(Math.pow(c.cg,k)-1)/(c.cg-1); }
function statMaxBuy(id){ const c=STATS.find(s=>s.id===id); const lv=S.st[id];
  const base=c.c0*Math.pow(c.cg,lv);
  let k=Math.floor(Math.log(S.gold*(c.cg-1)/base+1)/Math.log(c.cg));
  if(c.max) k=Math.min(k,c.max-lv);
  return Math.max(k,0); }
/* 원작형 커브(공개 앵커 반영): 재화 성장률은 층당 5% (100층부터 9%),
   체력 성장률 14.5%로 재화를 압도 → 강화 효율이 급락하는 벽.
   돌파는 승급(×2,×3,×5,×25… 대형 배수)·SP 성장·소환·황금곳간이 담당 */
function mobHP(n){ return 22*Math.pow(1.145,n-1); }
function mobAtk(n){ return 4*Math.pow(1.115,n-1); }
function mobGold(n){ const a=Math.min(n,100),b=Math.max(0,n-100);
  return 12*Math.pow(1.05,a-1)*Math.pow(1.09,b); }
function rankCost(){ return {gold:300*Math.pow(3.5,S.rank)}; }
function rankGateOk(){ return S.rank<RANK_MULTS.length&&S.maxClear>=RANK_GATES[S.rank]; }
/* 검객 레벨·SP (처치 경험치) */
function expNeed(lv){ return Math.floor(30*Math.pow(1.22,lv-1)); }
function expFor(n,boss){ return Math.floor((2+n*0.7)*(boss?10:1)*(1+spFx('exp')/100)*(1+accFx('exp')/100)*(1+rankOptSum('exp')/100)*(adbOn('exp')?3:1)); }
function gainExp(x){
  S.exp+=x;
  while(S.exp>=expNeed(S.lv)){
    S.exp-=expNeed(S.lv); S.lv++; S.sp+=3;
    toast('⬆️ 검객 '+S.lv+'레벨 달성! SP +3');
  }
}
function daoGain(){ const s=S.maxClear+1; if(s<400) return 0; return Math.floor(Math.pow(s/50,2)); }
function dps(){
  let d=heroAtk()*heroAps()*(1+heroCrit()/100*(heroCritD()/100-1));
  for(let i=0;i<4;i++){ const si=S.skEq[i];
    if(si>=0&&SKILLS[si].mult) d+=heroAtk()*skillMult(si)*SKILLS[si].hits/SKILLS[si].cd; }
  if(S.spEq>=0) d+=heroAtk()*2.5/4;

}
const CH_EL=['earth','wind','water','fire',null]; // 챕터 속성 (저승은 무속성 — 상성 무효)
function chapterOf(n){ return CH[Math.floor((n-1)/10)%CH.length]; }
function chapterEl(n){ return CH_EL[Math.floor((n-1)/10)%CH.length]; }
function chapterName(n){ const loop=Math.floor((n-1)/(CH.length*10)); return (loop>0?'심연 ':'')+chapterOf(n).nm; }
function addGold(n){ S.gold+=n; S.goldTotal+=n; }
function rollRar(weights,pityForce){
  if(pityForce!==undefined) return pityForce;
  const x=Math.random()*100; let acc=0;
  for(let i=weights.length-1;i>=0;i--){ acc+=weights[i].w; if(x<acc) return i; }
  return 0;
}

/* ═══════════ 전투 세계 ═══════════ */
const W={
  w:430,h:264,G:212,t:0,
  mode:'farm', // farm|boss|dungeon
  dg:null, // {id, lvl, timer, killed, need}
  enemies:[], spawnT:0.4, runX:0, running:true,
  hero:{x:96,hp:1,run:0,swing:0,swProg:1,hurt:0,dead:0,atkT:0.5,dustT:0},
  spirit:{bob:0,atkT:3,dash:0,dashX:0},
  cam:{shake:0,punch:0}, mana:100,
  hitStop:0, slowMo:0, bossTimer:0, bossDelay:0, victT:0, flash:0,
  dmgs:[],parts:[],projs:[],hits:[],coins:[],slashes:[],amb:[],lines:[],fx:[],
  clouds:[{x:60,y:34,s:1},{x:230,y:20,s:.7},{x:360,y:44,s:1.2}],
  tapCd:0, skCd:[0,0,0,0,0,0,0,0],
};
function curStageN(){ return W.mode==='dungeon'&&W.dg&&W.dg.id!=='rankup'?6*W.dg.lvl+4:S.stage; }
function spawnPack(){
  const n=curStageN(), ch=chapterOf(W.mode==='dungeon'?S.stage:n);
  let cnt=1;
  if(n>3&&Math.random()<0.5) cnt++;
  if(n>8&&Math.random()<0.4) cnt++;
  for(let i=0;i<cnt;i++){
    const m=ch.mobs[Math.floor(Math.random()*ch.mobs.length)];
    spawnEnemy(m,false,W.w+50+i*52,n);
  }
}
function spawnEnemy(def,boss,x,n){
  const hpB=boss?mobHP(n)*40:mobHP(n);
  const loop=Math.floor((S.stage-1)/(CH.length*10));
  W.enemies.push({
    sp:def[0],c:def[1],c2:def[2],nm:(loop>0?'심연 ':'')+def[3],size:def[4]*(boss?1.7:1),
    boss:!!boss,x:x,hp:hpB,maxhp:hpB,atk:boss?mobAtk(n)*3.2:mobAtk(n),
    gold:boss?mobGold(n)*35:mobGold(n),el:chapterEl(n),n:n,
    state:'walk',atkT:1.4+Math.random(),lunge:0,hitF:0,dieT:0,bob:Math.random()*7,frozen:0,
  });
}
function startBoss(){
  if(S.stage!==S.maxClear+1||S.kills<8||W.mode!=='farm') return;
  W.enemies=[]; W.mode='boss'; W.bossTimer=40;
  const ch=chapterOf(S.stage);
  spawnEnemy(ch.boss,true,W.w+60,S.stage);
  W.cam.shake=7; snd('boss');
  $('bossHud').hidden=false; $('bossNm').textContent='『 '+W.enemies[0].nm+' 』';
  updateSceneUI();
}
function frontEnemy(){ return W.enemies.find(e=>e.state!=='die'); }
function engageX(idx,e){ return W.hero.x+(e&&e.boss?80:56)+idx*42; }
function dmgText(x,y,txt,color,big){
  W.dmgs.push({x,y,txt,color:color||'#FFE9B8',t:0,big:!!big,vx:(Math.random()-0.5)*22});
  if(W.dmgs.length>44) W.dmgs.shift();
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++) W.parts.push({x,y,vx:(Math.random()-.5)*240,vy:-Math.random()*200-40,t:0,color,r:2+Math.random()*3.5});
  if(W.parts.length>140) W.parts.splice(0,W.parts.length-140);
}
function ring(x,y,color){ W.parts.push({x,y,vx:0,vy:0,t:0,color,r:-1}); }
function coinFly(x,y,n){ for(let i=0;i<Math.min(n,7);i++) W.coins.push({x,y,vx:-70-Math.random()*100,vy:-150-Math.random()*110,t:0}); }
function slashFx(x,y,ang,col){
  W.slashes.push({x,y,ang,t:0,col:col||'255,244,214'});
  if(W.slashes.length>16) W.slashes.shift();
}
function hitEnemy(e,dmg,opt){
  if(!e||e.state==='die') return;
  opt=opt||{};
  // 명중 판정 (원작: 고층 요괴는 명중 스탯 없이는 빗나간다)
  if(Math.random()*100>=hitChance(e.n||S.stage)){
    dmgText(e.x+(Math.random()-.5)*20,W.G-e.size*0.7-14,'빗나감!','#8F94A0');
    return;
  }
  const crit=Math.random()*100<heroCrit();
  const elm=elMult(opt.el,e.el); // 속성 상성 ×2 / ×0.7
  let d=dmg*(0.9+Math.random()*0.2)*(crit?heroCritD()/100:1)*elm;
  e.hp-=d; e.hitF=1;
  const ex=e.x, ey=W.G-e.size*0.7;
  const tag=elm>=2?'약점! ':(crit?'회심! ':'');
  const col=elm>=2?'#FFD24A':(elm<1?'#9FB2C4':(crit?'#FF8A5C':'#FFF2CC'));
  dmgText(ex+(Math.random()-.5)*22,ey-14,tag+fmt(d),col,crit||elm>=2);
  burst(ex,ey,crit?'#FF9A66':'#F2CE7B',crit?9:4);
  const pan=(e.x/W.w-0.5)*0.7;
  if(crit){ W.cam.shake=Math.max(W.cam.shake,e.boss?5:3); W.hitStop=Math.max(W.hitStop,0.045); ring(ex,ey,'255,170,110'); snd('crit',pan); W.hero.swBig=1; }
  else snd('hit',pan);
  if(!opt.noSlash) slashFx(ex-8,ey,(Math.random()-.5)*0.9,slashCol()); // 참격 색 = 장착 검 색
  if(opt.freeze) e.frozen=Math.max(e.frozen,opt.freeze);
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  if(e.state==='die') return;
  e.state='die'; e.dieT=0.45;
  const g=e.gold*goldMult();
  addGold(g); S.kTotal++;
  if(S.dq) S.dq.kills++;
  if(S.wq) S.wq.kills++;
  gainExp(expFor(W.mode==='dungeon'?curStageN():S.stage,e.boss));
  coinFly(e.x,W.G-20,e.boss?7:4);
  dmgText(e.x,W.G-e.size-16,'+'+fmt(g)+'냥','#F2CE7B');
  burst(e.x,W.G-e.size*0.6,'#C9B07C',e.boss?20:8);
  ring(e.x,W.G-e.size*0.6,'242,206,123');
  W.cam.punch=Math.max(W.cam.punch,e.boss?0.05:0.02);
  snd('coin',(e.x/W.w-0.5)*0.6);
  if(W.mode==='dungeon'){ W.dg.killed++; return; }
  if(e.boss){
    S.bossKills++;
    if(S.dq) S.dq.boss++;
    if(S.wq) S.wq.boss++;
    const first=S.stage>S.maxClear;
    bossVictoryFx(e.x,W.G-e.size*0.6,e.nm,first?S.stage:0);
    if(first){
      S.maxClear=S.stage; S.jade+=5;
      if(rankGateOk()) dmgText(W.w/2,150,'🏯 승급전 개방! 모험 탭에서 도전','#FF9A66',true);
    }
    S.stage=Math.min(S.stage+1,S.maxClear+1); S.kills=0;
    W.mode='farm'; $('bossHud').hidden=true;
    toast('👹 '+e.nm+' 격파! '+S.stage+'층으로');
    if(first){
      COMPS.forEach((c,ci)=>{ if(c.un===S.maxClear) toast('🤝 동료 합류! '+c.n+': '+c.line); });
      checkStory();
    }
  }else if(S.stage===S.maxClear+1){
    S.kills=Math.min(S.kills+1,8);
    if(S.kills>=8&&S.autoBoss&&W.mode==='farm') W.bossDelay=0.8;
  }
}
function heroDie(){
  const h=W.hero;
  h.dead=2.5; h.hp=0; snd('lose');
  if(W.mode==='boss'){
    W.mode='farm'; S.autoBoss=false; $('bossHud').hidden=true;
    toast('☠️ 패배… 수련 후 재도전하시오 (자동도전 해제)');
  }else if(W.mode==='dungeon'){ endDungeon(false); }
  W.enemies=[]; W.spawnT=1.2;
  updateSceneUI();
}
function update(dt){
  if(W.hitStop>0){ W.hitStop-=dt; return; }
  if(W.slowMo>0){ W.slowMo-=dt; dt*=0.3; }
  W.t+=dt;
  const h=W.hero;
  if(h.dead>0){ h.dead-=dt; if(h.dead<=0) h.hp=heroMaxHp(); }
  W.tapCd-=dt;
  if(W.bossDelay>0){ W.bossDelay-=dt; if(W.bossDelay<=0) startBoss(); }
  for(let i=0;i<8;i++) W.skCd[i]-=dt;
  buffAtk=Math.max(0,buffAtk-dt); buffAps=Math.max(0,buffAps-dt);
  W.mana=Math.min(100,W.mana+12*(1+rankOptSum('mana')/100)*(1+accFx('mana')/100)*(1+compLv(3)*0.02)*dt); // 내공 회복
  // 보스 제한시간
  if(W.mode==='boss'){
    W.bossTimer-=dt;
    if(W.bossTimer<=0){
      W.mode='farm'; S.autoBoss=false; W.enemies=[]; $('bossHud').hidden=true;
      toast('⏳ 시간 초과… 보스가 물러갔다 (자동도전 해제)'); W.spawnT=0.8; updateSceneUI();
    }
  }
  if(W.mode==='dungeon'){
    W.dg.timer-=dt;
    if(W.dg.id!=='trial'&&W.dg.timer<=0) endDungeon(W.dg.killed>=W.dg.need);
    else if(W.dg.id==='trial'&&W.dg.timer<=0) endDungeon(false);
    else if(W.dg.id!=='trial'&&W.dg.killed>=W.dg.need) endDungeon(true);
    else if(W.dg.id==='trial'&&W.dg.killed>=1) endDungeon(true);
  }
  // 생성
  const alive=W.enemies.filter(e=>e.state!=='die');
  if(alive.length===0&&h.dead<=0&&W.mode!=='boss'){
    W.spawnT-=dt;
    if(W.spawnT<=0){
      if(W.mode==='dungeon'){
        if(W.dg.id==='trial'){ const ch=chapterOf(S.stage); spawnEnemy(ch.boss,true,W.w+60,curStageN()); }
        else spawnPack();
      }else spawnPack();
      W.spawnT=0.4;
    }
  }
  // 달리는 중? (선두 적이 교전 전이거나 적 없음)
  const front=frontEnemy();
  W.running=h.dead<=0&&(!front||front.state==='walk');
  if(W.running){ W.runX+=165*dt; h.run+=dt*2.4; }
  // 적 갱신
  let idx=0;
  for(const e of W.enemies){
    if(e.state==='die'){ e.dieT-=dt; continue; }
    const tgt=engageX(idx,e);
    if(e.frozen>0){ e.frozen-=dt; }
    else if(e.x>tgt){ e.x=Math.max(tgt,e.x-130*dt); if(e.x<=tgt&&idx===0) e.atkT=Math.max(e.atkT,0.7); }
    e.state=e.x<=tgt+1?'fight':'walk';
    if(e.state==='fight'&&h.dead<=0&&e.frozen<=0){
      e.atkT-=dt;
      if(e.atkT<=0){
        e.atkT=1.8; e.lunge=1;
        if(Math.random()*100<heroDodge()){ // 회피 성공
          dmgText(h.x,W.G-84,'회피!','#9FE8C0');
        }else{
          h.hp-=e.atk*(0.9+Math.random()*0.2); h.hurt=1;
          W.cam.shake=Math.max(W.cam.shake,1.5);
          if(h.hp<=0){ heroDie(); break; }
        }
      }
    }
    e.hitF=Math.max(0,e.hitF-dt*5); e.lunge=Math.max(0,e.lunge-dt*3.5);
    e.slot=idx; // 대기열 깊이 (뒤쪽일수록 작고 위로 — 2.5D)
    idx++;
  }
  W.enemies=W.enemies.filter(e=>!(e.state==='die'&&e.dieT<=0));
  // 영웅 공격/기술
  if(front&&front.state==='fight'&&h.dead<=0){
    h.atkT-=dt;
    if(h.atkT<=0){ h.atkT=1/heroAps(); h.swing=1; h.swBig=0; hitEnemy(front,heroAtk()); }
    if(S.autoSkill) for(let s=0;s<8;s++){
      const si=S.skEq[s];
      if(si>=0&&W.skCd[si]<=0) castSkill(si);
    }
  }else{
    h.atkT=0; // 교전 대기 중엔 타이머를 비워 만나는 즉시 첫 타가 나가게 함
  }
  // 수호 영물
  if(S.spEq>=0){
    W.spirit.bob+=dt;
    if(front&&front.state==='fight'&&h.dead<=0){
      W.spirit.atkT-=dt;
      if(W.spirit.atkT<=0){ W.spirit.atkT=4; W.spirit.dash=1; W.spirit.dashX=front.x; }
    }
    if(W.spirit.dash>0){
      W.spirit.dash-=dt*2.2;
      if(W.spirit.dash<=0.5&&W.spirit.dash+dt*2.2>0.5){
        const f2=frontEnemy(); if(f2) hitEnemy(f2,heroAtk()*2.5,{noSlash:true});
        burst(W.spirit.dashX,W.G-40,'#9FE8C0',7);
      }
      if(W.spirit.dash<0) W.spirit.dash=0;
    }
  }
  // 회복
  if(h.dead<=0){
    const inF=front&&front.state==='fight';
    h.hp=Math.min(heroMaxHp(),h.hp+stVal('reg')*rankMult()*(inF?1:5)*dt);
  }
  h.swing=Math.max(0,h.swing-dt*7); h.hurt=Math.max(0,h.hurt-dt*4);
  if(W.running){ h.dustT-=dt; if(h.dustT<=0){ h.dustT=0.18;
    W.parts.push({x:h.x-8,y:W.G+1,vx:-40-Math.random()*30,vy:-20-Math.random()*24,t:0.25,color:'rgba(150,130,100,.5)',r:3}); } }
  // 지연 타격
  for(let i=W.hits.length-1;i>=0;i--){
    W.hits[i].t-=dt;
    if(W.hits[i].t<=0){
      const hh=W.hits[i];
      if(hh.aoe){ for(const e of W.enemies.slice()) hitEnemy(e,hh.dmg,hh.opt||{}); }
      else{ const f=frontEnemy(); if(f) hitEnemy(f,hh.dmg,hh.opt||{}); }
      W.hits.splice(i,1);
    }
  }
  // 투사체
  for(let i=W.projs.length-1;i>=0;i--){
    const p=W.projs[i]; p.x+=p.v*dt; p.t+=dt;
    const f=frontEnemy();
    if(f&&p.x>=f.x-14){ hitEnemy(f,p.dmg,{noSlash:true,el:p.el}); burst(p.x,W.G-34,'#BFE8FF',6); W.projs.splice(i,1); }
    else if(p.x>W.w+40||p.t>2) W.projs.splice(i,1);
  }
  // 이펙트 감쇠
  W.cam.shake=Math.max(0,W.cam.shake-dt*20);
  W.cam.punch=Math.max(0,W.cam.punch-dt*0.12);
  W.flash=Math.max(0,W.flash-dt*2.2); W.victT=Math.max(0,W.victT-dt);
  for(let i=W.dmgs.length-1;i>=0;i--){const d=W.dmgs[i];d.t+=dt;d.y-=48*dt;d.x+=d.vx*dt;if(d.t>0.95)W.dmgs.splice(i,1);}
  for(let i=W.parts.length-1;i>=0;i--){const p=W.parts[i];p.t+=dt;
    if(p.r>=0){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=430*dt;}
    if(p.t>0.7)W.parts.splice(i,1);}
  for(let i=W.coins.length-1;i>=0;i--){const c=W.coins[i];c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=320*dt;if(c.t>0.85)W.coins.splice(i,1);}
  for(let i=W.slashes.length-1;i>=0;i--){W.slashes[i].t+=dt;if(W.slashes[i].t>0.22)W.slashes.splice(i,1);}
  for(let i=W.fx.length-1;i>=0;i--){
    const f=W.fx[i]; f.t+=dt;
    if(f.type==='firewall'){ f.x+=460*dt;
      if(W.parts.length<140&&Math.random()<0.5) W.parts.push({x:f.x-10+Math.random()*20,y:W.G-Math.random()*60,vx:30,vy:-90-Math.random()*60,t:0.2,color:'rgba(255,'+(120+Math.random()*80|0)+',40,.8)',r:3});
    }
    if(f.t>f.dur) W.fx.splice(i,1);
  }
  // 속도선 — 반드시 '초당 개수'로 생성한다.
  // 프레임마다 확률로 뽑으면 120·144Hz 화면에서 60Hz의 2~2.4배가 쏟아져
  // 화면이 흰 선으로 뒤덮이고 그리기 부하도 그만큼 늘어난다.
  const lrate=(W.running?15:0)+(buffAps>0?14:0);
  if(lrate>0){
    W.lineT=(W.lineT||0)+dt*lrate;
    let n=Math.min(4,Math.floor(W.lineT)); W.lineT-=n; // 한 프레임 최대 4개
    while(n-->0){
      if(buffAps>0&&Math.random()<0.5) W.lines.push({y:W.G-20-Math.random()*50,x:W.hero.x+30,t:0});
      else W.lines.push({y:40+Math.random()*160,x:W.w+10,t:0});
    }
  }else W.lineT=0;
  for(let i=W.lines.length-1;i>=0;i--){const l=W.lines[i];l.x-=900*dt;l.t+=dt;if(l.x<-80)W.lines.splice(i,1);}
  if(W.lines.length>48) W.lines.splice(0,W.lines.length-48); // 어떤 상황에서도 상한 (기존엔 상한이 없었다)
  for(const c of W.clouds){ c.x-= (W.running?14:3)*dt*c.s; if(c.x<-70) c.x=W.w+60; }
  updateAmb(dt);
  S.playMs+=dt*1000;
  if(S.dq&&gameStarted) S.dq.playMs=(S.dq.playMs||0)+dt*1000;
}
function castSkill(i){
  const front=frontEnemy();
  const k=SKILLS[i];
  const cost=SK_COST[k.r];
  if(W.mana<cost) return; // 내공 부족 — 회복 후 자동 재시전
  if(k.buff){
    W.mana-=cost;
    W.skCd[i]=k.cd;
    const aw=!!S.skAw[i];
    if(k.buff==='atk'){
      buffAtk=k.bd; buffAtkV=aw?0.35:0.25;
      W.fx.push({type:'roar',x:W.hero.x+4,y:W.G-38,t:0,dur:0.7}); // 사자후 충격파
      W.cam.shake=Math.max(W.cam.shake,5);
    }else{
      buffAps=k.bd; buffApsV=aw?0.6:0.4;
      for(let k2=0;k2<8;k2++) W.lines.push({y:W.G-14-Math.random()*60,x:W.hero.x+40+Math.random()*60,t:0});
      burst(W.hero.x,W.G-6,'rgba(140,210,255,.8)',10);
    }
    W.fx.push({type:'banner',txt:(aw?SK_AW_NAME[i]:k.n)+'!',col:'#9FE8C0',t:0,dur:0.85});
    ring(W.hero.x,W.G-40,'159,232,192'); snd('skill');
    return;
  }
  if(!front||front.state!=='fight') return;
  W.mana-=cost;
  W.skCd[i]=k.cd;
  const dmg=heroAtk()*skillMult(i);
  const el=k.el||null;
  const nm=S.skAw[i]?SK_AW_NAME[i]:k.n;
  W.fx.push({type:'banner',txt:nm+'!',col:el?ELS[el].c:'#FFE9B8',t:0,dur:0.85});
  snd('skill');
  if(i===0){ // 삼연격/오의 오연격: 연속 대형 교차 참격
    const hits=S.skAw[0]?5:3;
    for(let t=0;t<hits;t++){
      W.hits.push({t:0.05+t*0.11,dmg,aoe:false,opt:{el}});
      setTimeout(()=>{ const f2=frontEnemy(); if(f2){
        slashFx(f2.x-6,W.G-f2.size*0.6,(t%2?0.7:-0.7),slashCol());
        W.hitStop=Math.max(W.hitStop,0.025); }
      },(0.05+t*0.11)*1000);
    }
    W.hero.swing=1; W.hero.swBig=1;
  }
  else if(i===2){ // 검기 방출: 초승달 검기 (각성 시 쌍검기)
    W.projs.push({x:W.hero.x+28,v:380,dmg:S.skAw[2]?dmg*0.5:dmg,el,t:0});
    if(S.skAw[2]) W.projs.push({x:W.hero.x+10,v:340,dmg:dmg*0.5,el,t:0});
  }
  else if(i===3){ // 화염참: 불의 장벽이 화면을 휩쓴다
    W.hits.push({t:0.28,dmg,aoe:true,opt:{el}});
    W.fx.push({type:'firewall',x:W.hero.x+20,t:0,dur:0.9});
    W.cam.shake=Math.max(W.cam.shake,4);
  }
  else if(i===5){ // 회천검무: 궤도 회전 참격
    W.hits.push({t:0.25,dmg,aoe:true,opt:{el}});
    W.fx.push({type:'spin',x:W.hero.x+8,y:W.G-40,t:0,dur:0.85});
    W.cam.shake=Math.max(W.cam.shake,6);
  }
  else if(i===6){ // 빙백검: 한기 장막 + 결정 빙결
    W.hits.push({t:0.15,dmg,aoe:true,opt:{freeze:2,el}});
    W.fx.push({type:'cold',t:0,dur:0.6});
    for(const e2 of W.enemies) if(e2.state!=='die') W.fx.push({type:'ice',x:e2.x,t:0,dur:2});
  }
  else if(i===7){ // 뇌격일섬: 전 적에게 낙뢰 연격
    W.hits.push({t:0.16,dmg,aoe:true,opt:{el}});
    W.flash=1; W.cam.shake=Math.max(W.cam.shake,10);
    W.enemies.forEach((e2,k2)=>{ if(e2.state!=='die') W.fx.push({type:'bolt',x:e2.x,t:-k2*0.07,dur:0.3}); });
    W.hitStop=Math.max(W.hitStop,0.05);
  }
}
function updateAmb(dt){
  const ch=chapterOf(S.stage);
  if(W.amb.length<16&&Math.random()<0.12)
    W.amb.push({x:Math.random()*W.w,y:-10,vx:(Math.random()-.5)*30,vy:22+Math.random()*40,ph:Math.random()*7});
  for(let i=W.amb.length-1;i>=0;i--){
    const a=W.amb[i];
    a.y+=a.vy*dt*(ch.amb==='rain'?6:1);
    a.x+=(a.vx+Math.sin(W.t+a.ph)*18-(W.running?50:0))*dt;
    if(a.y>W.G+10||a.x<-20) W.amb.splice(i,1);
  }
}

function dgTicketReset(){
  const today=new Date().toDateString();
  if(S.dgDate!==today){ S.dgDate=today; S.tickets={gold:2,trial:2,rift:2}; }
}
function enterDungeon(id,lvl){
  if(W.mode!=='farm') { toast('전투 중에는 입장할 수 없소'); return; }
  if(S.tickets[id]<=0){ toast('입장권이 없소 (매일 2장)'); return; }
  S.tickets[id]--;
  if(S.dq) S.dq.dg++;
  if(S.wq) S.wq.dg++;
  W.mode='dungeon'; W.enemies=[]; W.spawnT=0.3;
  W.dg={id,lvl,timer:id==='trial'?30:45,killed:0,need:15};
  toast('⛩️ '+DUNGEONS.find(d=>d.id===id).n+' '+lvl+'단계 입장!');
  switchTab('char'); updateSceneUI();
}
function dgReward(id,lvl){
  if(id==='gold') return {gold:mobGold(6*lvl+4)*400}; // 원작의 폐광처럼 주 골드 수급처
  if(id==='trial') return {sp:4+2*lvl}; // 무과시험 = 수련서(SP)
  return {seok:2+lvl};
}
function endDungeon(winB){
  const dg=W.dg; if(!dg) return;
  W.mode='farm'; W.dg=null; W.enemies=[]; W.spawnT=0.6;
  if(winB){
    const rw=dgReward(dg.id,dg.lvl);
    if(rw.gold){ addGold(rw.gold); toast('💰 황금곳간 정벌! +'+fmt(rw.gold)+'냥'); }
    if(rw.sp){ S.sp+=rw.sp; toast('📚 무과 급제! 수련서로 SP +'+rw.sp); }
    if(rw.seok){ S.seok+=rw.seok; toast('🔷 심연 정화! 영석 +'+rw.seok); }
    if(dg.lvl>S.dgClear[dg.id]) S.dgClear[dg.id]=dg.lvl;
    snd('reward');
  }else{ toast('💦 정벌 실패… 입장권만 소모되었소'); snd('lose'); }
  updateSceneUI();
}
function sweep(id){
  const lvl=S.dgClear[id];
  if(lvl<=0){ toast('먼저 1단계를 직접 정벌해야 하오'); return; }
  if(S.tickets[id]<=0){ toast('입장권이 없소'); return; }
  S.tickets[id]--;
  if(S.dq) S.dq.dg++;
  if(S.wq) S.wq.dg++;
  const rw=dgReward(id,lvl);
  if(rw.gold) addGold(rw.gold);
  if(rw.sp) S.sp+=rw.sp;
  if(rw.seok) S.seok+=rw.seok;
  snd('reward');
  toast('🧹 소탕 완료 ('+lvl+'단계): '+(rw.gold?'+'+fmt(rw.gold)+'냥':rw.sp?'SP +'+rw.sp:'영석 +'+rw.seok));
  buildAdvent(); updateHeader();
}
