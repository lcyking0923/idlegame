        cx.fillStyle='rgba(60,42,14,'+Math.min(1,a*2)+')'; cx.fillRect(-1.8,-1.8,3.6,3.6);
        cx.restore();
      }
    }else if(f.type==='petals'){ // 꽃잎 비
      for(const it of f.items){
        const tt=f.t-it.d; if(tt<0) continue;
        const y2=-8+tt*it.v; if(y2>W.h+8) continue;
        const x2=it.x+Math.sin(tt*2.2+it.sw)*22;
        cx.save(); cx.translate(x2,y2); cx.rotate(tt*3+it.sw);
        cx.fillStyle=it.c+Math.min(1,a*2)+')';
        cx.beginPath(); cx.ellipse(0,0,5,2.6,0,0,7); cx.fill();
        cx.restore();
      }
    }else if(f.type==='beam'){ // 하늘에서 꽂히는 빛기둥
      const wPul=(16+Math.sin(W.t*17)*4)*(f.t<0.15?f.t/0.15:1)*(a<0.4?a/0.4:1);
      const bg3=cx.createLinearGradient(f.x-wPul,0,f.x+wPul,0);
      bg3.addColorStop(0,'rgba(255,236,170,0)');
      bg3.addColorStop(0.5,'rgba(255,236,170,'+(0.5*Math.min(1,a*1.6))+')');
      bg3.addColorStop(1,'rgba(255,236,170,0)');
      cx.fillStyle=bg3; cx.fillRect(f.x-wPul,-12,wPul*2,G+8);
      cx.fillStyle='rgba(255,236,170,'+(0.3*a)+')';
      cx.beginPath(); cx.ellipse(f.x,G,wPul*2.1,8,0,0,7); cx.fill();
    }else if(f.type==='stamp'){ // 관인(도장) 쾅
      const st=Math.min(1,f.t/0.3);
      const sc=3-2.1*(st*st); // 크게 → 내리찍힘
      cx.save(); cx.translate(W.w/2,128); cx.scale(sc,sc); cx.rotate(-0.08+st*0.08);
      cx.globalAlpha=Math.min(1,f.t/0.1)*Math.min(1,a*2.2);
      cx.strokeStyle='#D8402C'; cx.lineWidth=3.4;
      cx.beginPath(); cx.arc(0,0,30,0,7); cx.stroke();
      cx.lineWidth=1.4; cx.beginPath(); cx.arc(0,0,25,0,7); cx.stroke();
      cx.fillStyle='#D8402C';
      cx.font='bold 15px "Gungsuh","Batang",serif';
      const tw2=cx.measureText(f.txt).width;
      cx.fillText(f.txt,-tw2/2,5);
      cx.restore();
      if(f.t>0.28&&f.t<0.34) W.cam.shake=Math.max(W.cam.shake,7);
    }else if(f.type==='bigbanner'){ // 대형 승전 배너
      const sc=f.t<0.14?0.4+f.t/0.14*0.72:(f.t<0.3?1.12-(f.t-0.14)/0.16*0.12:1);
      cx.save(); cx.translate(W.w/2,86); cx.scale(sc,sc); cx.globalAlpha=Math.min(1,a*2);
      cx.font='bold 38px "Gungsuh","Batang",serif';
      const tw3=cx.measureText(f.main).width;
      cx.strokeStyle='rgba(0,0,0,.9)'; cx.lineWidth=7; cx.strokeText(f.main,-tw3/2,0);
      const gld=cx.createLinearGradient(0,-30,0,6);
      gld.addColorStop(0,'#FFF2C8'); gld.addColorStop(1,'#E8B23E');
      cx.fillStyle=gld; cx.fillText(f.main,-tw3/2,0);
      cx.strokeStyle='rgba(255,214,110,'+(0.8*a)+')'; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(-tw3/2-46,8); cx.lineTo(-tw3/2-10,8); cx.moveTo(tw3/2+10,8); cx.lineTo(tw3/2+46,8); cx.stroke();
      cx.font='bold 13px "Malgun Gothic",sans-serif';
      const tw4=cx.measureText(f.sub).width;
      cx.strokeStyle='rgba(0,0,0,.8)'; cx.lineWidth=3.4; cx.strokeText(f.sub,-tw4/2,24);
      cx.fillStyle='#FFE9B8'; cx.fillText(f.sub,-tw4/2,24);
      cx.restore();
    }else if(f.type==='banner'){ // 스킬명 붓글씨 배너
      const sc=f.t<0.12?0.5+f.t/0.12*0.6:(f.t<0.25?1.1-(f.t-0.12)/0.13*0.1:1);
      cx.save(); cx.translate(W.w/2,64); cx.scale(sc,sc); cx.globalAlpha=Math.min(1,a*2);
      cx.font='bold 24px "Gungsuh","Batang",serif';
      const tw=cx.measureText(f.txt).width;
      cx.strokeStyle='rgba(0,0,0,.85)'; cx.lineWidth=5; cx.strokeText(f.txt,-tw/2,0);
      cx.fillStyle=f.col||'#FFE9B8'; cx.fillText(f.txt,-tw/2,0);
      cx.restore();
    }
  }
  cx.restore();
  // 베기 이펙트
  cx.save(); cx.globalCompositeOperation='lighter';
  for(const s of W.slashes){
    const a=1-s.t/0.22;
    cx.save(); cx.translate(s.x,s.y); cx.rotate(s.ang);
    cx.strokeStyle='rgba('+s.col+','+(0.9*a)+')'; cx.lineWidth=4;
    cx.beginPath(); cx.arc(0,0,21,-0.95,0.95); cx.stroke();
    cx.strokeStyle='rgba('+s.col+','+(0.3*a)+')'; cx.lineWidth=9;
    cx.beginPath(); cx.arc(-5,0,19,-0.75,0.75); cx.stroke();
    cx.restore();
  }
  cx.restore();
  // 파티클/링/동전
  for(const p of W.parts){
    const a=Math.max(0,1-p.t/0.7);
    if(p.r<0){ // 충격 링
      cx.strokeStyle='rgba('+p.color+','+(a*0.7)+')'; cx.lineWidth=2.5;
      cx.beginPath(); cx.arc(p.x,p.y,4+p.t*90,0,7); cx.stroke();
    }else{
      cx.globalAlpha=a; cx.fillStyle=p.color;
      cx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);
    }
  }
  cx.globalAlpha=1;
  for(const c of W.coins){
    cx.globalAlpha=Math.max(0,1-c.t/0.85);
    cx.fillStyle='#D9A441'; cx.beginPath(); cx.arc(c.x,c.y,4,0,7); cx.fill();
    cx.fillStyle='#8A6420'; cx.fillRect(c.x-1.5,c.y-1.5,3,3);
  }
  cx.globalAlpha=1;
  // 데미지 숫자 (팝 이징)
  for(const d of W.dmgs){
    const a=Math.max(0,1-d.t/0.95);
    const sc=d.t<0.12?0.6+d.t/0.12*0.55:(d.t<0.25?1.15-(d.t-0.12)/0.13*0.15:1);
    cx.save(); cx.translate(d.x,d.y); cx.scale(sc,sc); cx.globalAlpha=a;
    cx.font=(d.big?'bold 18px ':'bold 13px ')+'"Malgun Gothic",sans-serif';
    cx.strokeStyle='rgba(0,0,0,.75)'; cx.lineWidth=3; cx.strokeText(d.txt,-20,0);
    cx.fillStyle=d.color; cx.fillText(d.txt,-20,0);
    cx.restore();
  }
  cx.globalAlpha=1;
  // 전경 풀 (1.35×)
  cx.fillStyle='rgba(10,8,5,.55)';
  for(let i=0;i<14;i++){
    const gx=mod(i*37+hash(i*11)*30-W.runX*1.35,W.w+40)-20;
    const gh=8+hash(i*13)*10;
    cx.beginPath(); cx.moveTo(gx-4,W.h); cx.quadraticCurveTo(gx-1,W.h-gh,gx+1,W.h-gh-2);
    cx.quadraticCurveTo(gx+3,W.h-gh,gx+5,W.h); cx.closePath(); cx.fill();
  }
  // 승리/던전 HUD 텍스트
  if(W.mode==='dungeon'&&W.dg){
    cx.font='bold 13px "Malgun Gothic",sans-serif';
    const dgDef=DUNGEONS.find(d=>d.id===W.dg.id);
    const dgNm=dgDef?dgDef.n:'승급 시험';
    const t=dgNm+(dgDef?' '+W.dg.lvl+'단계':'')+' · '+Math.ceil(W.dg.timer)+'초'+(dgDef&&W.dg.id!=='trial'?' · '+W.dg.killed+'/'+W.dg.need:'');
    const tw=cx.measureText(t).width;
    cx.fillStyle='rgba(14,10,6,.7)'; cx.fillRect((W.w-tw)/2-8,44,tw+16,20);
    cx.fillStyle='#9FE8C0'; cx.fillText(t,(W.w-tw)/2,58);
  }
  // 섬광
  if(W.flash>0){
    cx.fillStyle='rgba(255,255,240,'+(W.flash*0.5)+')'; cx.fillRect(-12,-12,W.w+24,W.h+24);
    if(W.flash>0.5){
      const f=frontEnemy();
      if(f){
        cx.strokeStyle='rgba(255,255,180,'+W.flash+')'; cx.lineWidth=3;
        cx.beginPath(); let lx=f.x,ly=0; cx.moveTo(lx+10,0);
        while(ly<G-30){ ly+=22; lx+=(Math.random()-.5)*28; cx.lineTo(lx,ly); }
        cx.stroke();
      }
    }
  }
  cx.restore();
  // 비네트 (2.5D 깊이감 마감)
  const vg=cx.createRadialGradient(W.w/2,W.h/2,W.h*0.55,W.w/2,W.h/2,W.h*1.05);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.3)');
  cx.fillStyle=vg; cx.fillRect(0,0,W.w,W.h);
}
function drawRidge(color,speed,hgt,base){
  cx.fillStyle=color;
  cx.beginPath(); cx.moveTo(-20,W.G);
  for(let x=-20;x<=W.w+40;x+=16){
    const k=(x+W.runX*speed)/150;
    cx.lineTo(x,W.G-base-Math.abs(Math.sin(k*1.9))*hgt-Math.abs(Math.sin(k*0.7))*hgt*0.5);
  }
  cx.lineTo(W.w+20,W.G); cx.closePath(); cx.fill();
}
function drawDecoLayer(ch,speed){
  const gap=104;
  const first=Math.floor((W.runX*speed-40)/gap);
  for(let k=first;k<first+Math.ceil((W.w+120)/gap);k++){
    const x=k*gap-W.runX*speed+gap*0.5+hash(k)*36-18;
    const type=ch.deco[((k%ch.deco.length)+ch.deco.length)%ch.deco.length];
    drawDeco(type,x,ch.tree,0.9+hash(k+5)*0.5);
  }
}
function drawDeco(type,x,col,s){
  const G=W.G;
  cx.fillStyle='rgba(0,0,0,.22)';
  cx.beginPath(); cx.ellipse(x,G+1,15*s,3*s,0,0,7); cx.fill();
  cx.fillStyle=col;
  if(type==='pine'){
    cx.fillRect(x-2*s,G-26*s,4*s,26*s);
    for(let i=0;i<3;i++){
      const w=(22-i*5)*s, y=G-20*s-i*13*s;
      cx.beginPath(); cx.moveTo(x-w/2,y); cx.lineTo(x,y-16*s); cx.lineTo(x+w/2,y); cx.closePath(); cx.fill();
    }
  }else if(type==='hanok'){
    cx.beginPath(); cx.moveTo(x-26*s,G-20*s); cx.quadraticCurveTo(x,G-38*s,x+26*s,G-20*s);
    cx.lineTo(x+20*s,G-16*s); cx.lineTo(x-20*s,G-16*s); cx.closePath(); cx.fill();
    cx.fillRect(x-16*s,G-16*s,32*s,16*s);
  }else if(type==='jang'){
    cx.fillRect(x-3*s,G-34*s,6*s,34*s);
    cx.beginPath(); cx.arc(x,G-38*s,7*s,0,7); cx.fill();
    cx.fillRect(x-8*s,G-30*s,16*s,3*s);
  }else if(type==='rock'){
    cx.beginPath(); cx.moveTo(x-14*s,G); cx.quadraticCurveTo(x-10*s,G-16*s,x,G-18*s);
    cx.quadraticCurveTo(x+12*s,G-14*s,x+14*s,G); cx.closePath(); cx.fill();
  }else if(type==='grave'){
    cx.beginPath(); cx.arc(x,G,14*s,Math.PI,0); cx.fill();
    cx.fillRect(x+10*s,G-20*s,3*s,20*s);
  }else if(type==='gate'){
    cx.fillRect(x-18*s,G-36*s,4*s,36*s); cx.fillRect(x+14*s,G-36*s,4*s,36*s);
    cx.fillRect(x-22*s,G-36*s,44*s,5*s); cx.fillRect(x-19*s,G-29*s,38*s,3*s);
  }else if(type==='boat'){
    cx.beginPath(); cx.moveTo(x-18*s,G-8*s); cx.quadraticCurveTo(x,G-2*s,x+18*s,G-8*s);
    cx.lineTo(x+14*s,G-2*s); cx.lineTo(x-14*s,G-2*s); cx.closePath(); cx.fill();
    cx.fillRect(x-1*s,G-22*s,2*s,15*s);
  }else if(type==='reed'){
    cx.strokeStyle=col; cx.lineWidth=2*s;
    for(let i=-1;i<=1;i++){
      cx.beginPath(); cx.moveTo(x+i*5*s,G);
      cx.quadraticCurveTo(x+i*5*s+3,G-14*s,x+i*5*s+6+Math.sin(W.t*2+i)*2,G-22*s); cx.stroke();
    }
  }
}
function drawAmb(ch){
  for(const a of W.amb){
    if(ch.amb==='snow'){cx.fillStyle='rgba(240,244,255,.7)';cx.beginPath();cx.arc(a.x,a.y,2,0,7);cx.fill();}
    else if(ch.amb==='rain'){cx.strokeStyle='rgba(160,200,230,.5)';cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(a.x-2,a.y+9);cx.stroke();}
    else if(ch.amb==='leaf'){cx.fillStyle='rgba(190,160,90,.7)';cx.save();cx.translate(a.x,a.y);cx.rotate(a.ph+W.t);cx.fillRect(-3,-1.5,6,3);cx.restore();}
    else if(ch.amb==='spore'){cx.fillStyle='rgba(230,150,200,.5)';cx.beginPath();cx.arc(a.x,a.y,1.6,0,7);cx.fill();}
    else{cx.fillStyle='rgba(150,200,255,'+(0.3+0.3*Math.sin(W.t*3+a.ph))+')';cx.beginPath();cx.arc(a.x,a.y,2.2,0,7);cx.fill();}
  }
}
/* ── 영웅: 셀셰이딩 벡터 ── */
function drawHero(h){
  const G=W.G, x=h.x;
  const run=W.running;
  const bob=h.dead>0?0:(run?Math.abs(Math.sin(h.run*5.2))*3.2:Math.sin(W.t*2)*1.2);
  const lean=run?0.1:0;
  const OUT='#191209';
  const spr=HeroSpr.ready; // 스프라이트가 준비됐으면 벡터 검객 대신 원화 프레임
  cx.save();
  if(h.dead>0&&!spr){ cx.translate(x,G-6); cx.rotate(-1.35); cx.globalAlpha=0.55; cx.translate(-x,-(G-6)); }
  // 그림자
  cx.fillStyle='rgba(0,0,0,.32)'; cx.beginPath(); cx.ellipse(x+2,G+3,21,4.5,0,0,7); cx.fill();
  // 버프 오라 (사자후=황금 화염 / 질풍=푸른 바람)
  if(h.dead<=0&&(buffAtk>0||buffAps>0)){
    cx.save(); cx.globalCompositeOperation='lighter';
    const ac2=buffAtk>0?'255,200,90':'120,200,255';
    const gr2=cx.createRadialGradient(x+2,G-34,6,x+2,G-34,34);
    gr2.addColorStop(0,'rgba('+ac2+',.22)'); gr2.addColorStop(1,'rgba('+ac2+',0)');
    cx.fillStyle=gr2; cx.beginPath(); cx.arc(x+2,G-34,34,0,7); cx.fill();
    for(let k2=0;k2<4;k2++){
      const fx2=x-14+k2*10+Math.sin(W.t*9+k2*2)*3;
      const fh=10+Math.sin(W.t*13+k2)*5;
      cx.fillStyle='rgba('+ac2+','+(0.28+Math.sin(W.t*11+k2)*0.12)+')';
      cx.beginPath(); cx.moveTo(fx2-3,G-2); cx.quadraticCurveTo(fx2,G-14-fh,fx2+1,G-16-fh);
      cx.quadraticCurveTo(fx2+3,G-12-fh*0.5,fx2+3,G-2); cx.closePath(); cx.fill();
    }
    cx.restore();
  }
  cx.save();
  if(spr) HeroSpr.draw(h);
  else{
  cx.translate(x,G-30+ -bob*0); cx.rotate(lean); cx.translate(-x,-(G-30));
  // 다리 (무릎 굽힘 주행 사이클)
  const legs=[0,Math.PI];
  cx.lineCap='round';
  for(const ph of legs){
    const sw=run?Math.sin(h.run*10.4+ph):(ph?0.35:-0.2);
    const hipX=x-1, hipY=G-25+bob*0.3;
    const kneeX=hipX+sw*9, kneeY=hipY+11+Math.max(0,-Math.cos(h.run*10.4+ph))*2;
    const footX=hipX+sw*15, footY=run?Math.min(G,kneeY+12-Math.max(0,Math.sin(h.run*10.4+ph))*5):G;
    cx.strokeStyle=OUT; cx.lineWidth=6.5;
    cx.beginPath(); cx.moveTo(hipX,hipY); cx.lineTo(kneeX,kneeY); cx.lineTo(footX,footY); cx.stroke();
    cx.strokeStyle='#2E3A4E'; cx.lineWidth=4;
    cx.beginPath(); cx.moveTo(hipX,hipY); cx.lineTo(kneeX,kneeY); cx.lineTo(footX,footY); cx.stroke();
    // 짚신
    cx.fillStyle='#C9B07C'; cx.beginPath(); cx.ellipse(footX+2,footY-1,4.5,2.5,0,0,7); cx.fill();
  }
  // 도포 자락(뒤) — 의상 스킨 적용
  const RB=ROBES[S.skin.robe||0]||ROBES[0];
  const fl=Math.sin(W.t*8)*3+(run?4:0);
  cx.fillStyle=RB.c2;
  cx.beginPath();
  cx.moveTo(x-8,G-44+bob);
  cx.quadraticCurveTo(x-16-fl,G-22+bob,x-14-fl*1.4,G-8+bob);
  cx.lineTo(x-2,G-12+bob); cx.closePath(); cx.fill();
  // 몸통(도포)
  cx.strokeStyle=OUT; cx.lineWidth=2.2;
  cx.fillStyle=RB.c1;
  cx.beginPath();
  cx.moveTo(x-9,G-46+bob);
  cx.quadraticCurveTo(x-13,G-26+bob,x-11-fl*0.5,G-10+bob);
  cx.lineTo(x+11,G-10+bob);
  cx.quadraticCurveTo(x+13,G-28+bob,x+9,G-46+bob);
  cx.closePath(); cx.fill(); cx.stroke();
  // 음영
  cx.fillStyle='rgba(20,30,50,.28)';
  cx.beginPath(); cx.moveTo(x+3,G-45+bob); cx.quadraticCurveTo(x+9,G-28+bob,x+7,G-11+bob);
  cx.lineTo(x+11,G-10+bob); cx.quadraticCurveTo(x+13,G-28+bob,x+9,G-46+bob); cx.closePath(); cx.fill();
  // 옷깃
  cx.strokeStyle='#E8DDC0'; cx.lineWidth=2.6;
  cx.beginPath(); cx.moveTo(x-4,G-45+bob); cx.lineTo(x+2,G-33+bob); cx.stroke();
  // 허리띠
  cx.strokeStyle='#B93A2B'; cx.lineWidth=3.6;
  cx.beginPath(); cx.moveTo(x-10,G-29+bob); cx.lineTo(x+11,G-29+bob); cx.stroke();
  cx.fillStyle='#B93A2B'; cx.fillRect(x-2,G-29+bob,3,8); // 띠 매듭
  // 뒷팔
  cx.strokeStyle=OUT; cx.lineWidth=6;
  cx.beginPath(); cx.moveTo(x-5,G-42+bob); cx.lineTo(x-11+(run?Math.sin(h.run*10.4)*5:0),G-32+bob); cx.stroke();
  cx.strokeStyle=RB.c3; cx.lineWidth=3.8;
  cx.beginPath(); cx.moveTo(x-5,G-42+bob); cx.lineTo(x-11+(run?Math.sin(h.run*10.4)*5:0),G-32+bob); cx.stroke();
  // 머리
  cx.fillStyle='#F0C9A0'; cx.strokeStyle=OUT; cx.lineWidth=2;
  cx.beginPath(); cx.arc(x+3,G-54+bob,7.5,0,7); cx.fill(); cx.stroke();
  cx.fillStyle=OUT; cx.beginPath(); cx.arc(x+6.5,G-55+bob,1.1,0,7); cx.fill(); // 눈
  cx.strokeStyle=OUT; cx.lineWidth=1.2;
  cx.beginPath(); cx.moveTo(x+4.5,G-58+bob); cx.lineTo(x+8,G-58.4+bob); cx.stroke(); // 눈썹
  // 갓
  cx.fillStyle='#17120E'; cx.strokeStyle=OUT;
  cx.beginPath(); cx.ellipse(x+3,G-60+bob,15,3.8,-0.06,0,7); cx.fill();
  cx.beginPath(); cx.moveTo(x-4,G-60+bob); cx.lineTo(x-2,G-69+bob); cx.lineTo(x+9,G-69+bob); cx.lineTo(x+11,G-60+bob); cx.closePath(); cx.fill();
  // 갓끈 (턱끈 + 구슬)
  cx.strokeStyle='rgba(30,22,14,.85)'; cx.lineWidth=1.3;
  cx.beginPath(); cx.moveTo(x-2,G-58+bob); cx.quadraticCurveTo(x-4-fl*0.4,G-48+bob,x-3-fl*0.8,G-42+bob); cx.stroke();
  cx.fillStyle='#7A9AB8';
  cx.beginPath(); cx.arc(x-3-fl*0.8,G-42+bob,1.6,0,7); cx.fill();
  // 칼 팔 + 검 (잔상)
  const pivX=x+8,pivY=G-40+bob;
  const prog=1-h.swing;
  const ease=prog<0.5?2*prog*prog:1-Math.pow(-2*prog+2,2)/2;
  const ang=h.swing>0?-1.9+ease*2.7:(run?-2.2:-0.65);
  if(!drawHero.after) drawHero.after=[];
  drawHero.after.unshift(ang); if(drawHero.after.length>4) drawHero.after.pop();
  for(let i=drawHero.after.length-1;i>=0;i--){
    const a=drawHero.after[i];
    cx.save(); cx.translate(pivX,pivY); cx.rotate(a);
    cx.globalAlpha=(h.dead>0?0.4:1)*(i===0?1:0.14*(4-i));
    if(i===0){
      cx.strokeStyle=OUT; cx.lineWidth=6.2;
      cx.beginPath(); cx.moveTo(-7,3); cx.lineTo(5,0); cx.stroke();
      cx.strokeStyle='#3E6390'; cx.lineWidth=4;
      cx.beginPath(); cx.moveTo(-7,3); cx.lineTo(5,0); cx.stroke();
      cx.fillStyle='#F0C9A0'; cx.beginPath(); cx.arc(6,0,2.6,0,7); cx.fill(); // 손
    }
    cx.strokeStyle='#5E4226'; cx.lineWidth=3.6;
    cx.beginPath(); cx.moveTo(4,0); cx.lineTo(12,0); cx.stroke();
    cx.strokeStyle='#D9A441'; cx.lineWidth=1.8;
    cx.beginPath(); cx.moveTo(12,-3.4); cx.lineTo(12,3.4); cx.stroke();
    const BST=bladeStyle();
    if(BST.glow&&i===0){ // 검광 (스킨/고등급 무기)
      cx.strokeStyle=BST.glow; cx.lineWidth=BST.wd+4.5;
      cx.beginPath(); cx.moveTo(13,0); cx.lineTo(BST.len+11,-1.2); cx.stroke();
    }

    bg.addColorStop(0,BST.g1); bg.addColorStop(1,BST.g2);
    cx.strokeStyle=bg; cx.lineWidth=BST.wd;
    cx.beginPath(); cx.moveTo(13,0); cx.lineTo(BST.len+11,-1.2); cx.stroke();
    cx.strokeStyle='rgba(255,255,255,.75)'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(14,-1.2); cx.lineTo(BST.len+9,-2.2); cx.stroke();
    cx.restore();
  }
  }
  cx.globalAlpha=1;
  if(h.hurt>0){
    cx.fillStyle='rgba(220,60,40,'+(h.hurt*0.35)+')';
    cx.beginPath(); cx.arc(x+2,G-36+bob,28,0,7); cx.fill();
  }
  cx.restore();
  cx.restore();
  // 체력바 / 부활
  if(h.dead<=0){
    const w=46, hp=Math.max(0,h.hp/heroMaxHp());
    cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(x-w/2,G-80,w,5);
    cx.fillStyle=hp>0.35?'#5B8F72':'#C05040'; cx.fillRect(x-w/2+1,G-79,(w-2)*hp,3);
    // 내공(마나) 막대

    cx.fillStyle='#5C87B5'; cx.fillRect(x-w/2+1,G-73,(w-2)*(W.mana/100),2);
  }else{
    cx.font='bold 12px sans-serif'; cx.fillStyle='#FFD9C2';
    cx.fillText('부활 '+h.dead.toFixed(1)+'초',x-26,G-80);
  }
}
/* ── 몬스터: 종족별 벡터 ── */
function drawMonster(e){
  const sl=Math.min(e.slot||0,2), dep=1-sl*0.09;
  const G=W.G-sl*9; // 뒤쪽 슬롯은 위로+작게 (2.5D 깊이)
  const SZ=e.size*dep;
  const dieP=e.state==='die'?1-e.dieT/0.45:0;
  const bob=e.state==='die'?0:Math.sin(W.t*5+e.bob)*3;
  const lung=Math.sin(e.lunge*Math.PI)*22;
  const sq=1+Math.sin(W.t*6+e.bob)*0.035+e.hitF*0.16;
  const x=e.x-lung, s=SZ/32, yb=G+bob*0.4;
  cx.save();
  if(sl>0) cx.globalAlpha=1-sl*0.13; // 원근 감쇠
  if(e.state==='die'){ cx.globalAlpha=1-dieP;
    cx.translate(x,yb-14*s); cx.rotate(dieP*1.3); cx.scale(1+dieP*0.35,1-dieP*0.5); cx.translate(-x,-(yb-14*s)); }
  // 그림자 (부드러운 라디얼)
  const shd=cx.createRadialGradient(e.x,G+3,2,e.x,G+3,SZ*0.55);
  shd.addColorStop(0,'rgba(0,0,0,.34)'); shd.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=shd; cx.beginPath(); cx.ellipse(e.x,G+3,SZ*0.55,5,0,0,7); cx.fill();
  // 보스 오라
  if(e.boss){
    cx.save(); cx.globalCompositeOperation='lighter';
    const pu=0.5+Math.sin(W.t*4)*0.2;
    const gr=cx.createRadialGradient(x,yb-16*s,4,x,yb-16*s,SZ*0.9);
    gr.addColorStop(0,'rgba(255,120,60,'+(0.22*pu)+')'); gr.addColorStop(1,'rgba(255,120,60,0)');
    cx.fillStyle=gr; cx.beginPath(); cx.arc(x,yb-16*s,SZ*0.9,0,7); cx.fill();
    cx.restore();
  }
  const MD=MobSpr.get(e.nm); // 원화 스프라이트가 등록된 몬스터면 벡터 대신 사용
  const hit=e.hitF>0.45;
  const MAIN=hit?'#FFFFFF':e.c, DARK=hit?'#E8E8E8':e.c2, OUT='#12100C';
  cx.strokeStyle=OUT; cx.lineWidth=2*Math.min(s,1.6);
  cx.save(); cx.translate(x,yb); cx.scale(sq*(e.frozen>0?1:1),1/sq*(1-dieP*0.1)); cx.translate(-x,-yb);
  if(MD){
    MobSpr.draw(e,MD,x,yb,SZ/MD.ref);
    if(hit){ // 피격 시 하얗게 번쩍
      cx.save(); cx.globalCompositeOperation='lighter'; cx.globalAlpha=e.hitF*0.5;
      MobSpr.draw(e,MD,x,yb,SZ/MD.ref);
      cx.restore();
    }
  }
  else if(e.sp==='imp'){
    // 도깨비: 몸통+뿔+방망이
    cx.fillStyle=MAIN;
    cx.beginPath(); cx.ellipse(x,yb-14*s,11*s,13*s,0,0,7); cx.fill(); cx.stroke();
    cx.fillStyle=DARK; cx.beginPath(); cx.ellipse(x,yb-9*s,7*s,6*s,0,0,7); cx.fill(); // 배
    // 뿔
    cx.fillStyle=hit?'#FFF':'#E8DDC0';
    cx.beginPath(); cx.moveTo(x-6*s,yb-24*s); cx.lineTo(x-4*s,yb-31*s); cx.lineTo(x-2*s,yb-24*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.beginPath(); cx.moveTo(x+2*s,yb-24*s); cx.lineTo(x+4*s,yb-31*s); cx.lineTo(x+6*s,yb-24*s); cx.closePath(); cx.fill(); cx.stroke();
    // 눈+송곳니
    cx.fillStyle='#FFF'; cx.beginPath(); cx.arc(x-5*s,yb-18*s,2.6*s,0,7); cx.fill();
    cx.fillStyle=OUT; cx.beginPath(); cx.arc(x-5.8*s,yb-18*s,1.2*s,0,7); cx.fill();
    cx.fillStyle='#FFF'; cx.beginPath(); cx.moveTo(x-4*s,yb-10*s); cx.lineTo(x-2.6*s,yb-7*s); cx.lineTo(x-1.4*s,yb-10*s); cx.closePath(); cx.fill();
    // 방망이 (내려침 모션)
    const arm=e.lunge>0? -0.9+Math.sin(e.lunge*Math.PI)*1.6 : -0.5+Math.sin(W.t*3+e.bob)*0.1;
    cx.save(); cx.translate(x-9*s,yb-16*s); cx.rotate(arm);
    cx.fillStyle=hit?'#EEE':'#6E4A28';
    cx.fillRect(-2*s,-16*s,4*s,16*s); cx.strokeRect(-2*s,-16*s,4*s,16*s);
    cx.beginPath(); cx.ellipse(0,-17*s,4.5*s,6*s,0,0,7); cx.fill(); cx.stroke();
    cx.restore();
    // 다리
    cx.fillStyle=DARK;
    cx.beginPath(); cx.ellipse(x-5*s,yb-1,3.4*s,3*s,0,0,7); cx.fill();
    cx.beginPath(); cx.ellipse(x+5*s,yb-1,3.4*s,3*s,0,0,7); cx.fill();
  }else if(e.sp==='beast'){
    const gal=e.state==='walk'?Math.sin(W.t*14+e.bob):0;
    // 꼬리
    cx.strokeStyle=OUT; cx.lineWidth=3.5*s;
    cx.beginPath(); cx.moveTo(x+12*s,yb-14*s);
    cx.quadraticCurveTo(x+19*s,yb-20*s+Math.sin(W.t*5)*2,x+21*s,yb-14*s); cx.stroke();
    cx.strokeStyle=MAIN; cx.lineWidth=2.2*s;
    cx.beginPath(); cx.moveTo(x+12*s,yb-14*s);
    cx.quadraticCurveTo(x+19*s,yb-20*s+Math.sin(W.t*5)*2,x+21*s,yb-14*s); cx.stroke();
    // 다리 4개
    cx.strokeStyle=OUT; cx.lineWidth=4*s; cx.lineCap='round';
    for(let i=0;i<4;i++){
      const lx=x+(i<2?-8:7)*s+(i%2)*4*s;
      const sw2=gal*(i%2?4:-4);
      cx.beginPath(); cx.moveTo(lx,yb-10*s); cx.lineTo(lx+sw2*s*0.5,yb-1); cx.stroke();
    }
    cx.strokeStyle=DARK; cx.lineWidth=2.6*s;
    for(let i=0;i<4;i++){
      const lx=x+(i<2?-8:7)*s+(i%2)*4*s;
      const sw2=gal*(i%2?4:-4);
      cx.beginPath(); cx.moveTo(lx,yb-10*s); cx.lineTo(lx+sw2*s*0.5,yb-1); cx.stroke();
    }
    // 몸통
    cx.strokeStyle=OUT; cx.lineWidth=2*Math.min(s,1.6);
    cx.fillStyle=MAIN;
    cx.beginPath(); cx.ellipse(x,yb-13*s,14*s,8.5*s,0,0,7); cx.fill(); cx.stroke();
    cx.fillStyle=DARK; cx.beginPath(); cx.ellipse(x+2*s,yb-9*s,9*s,4*s,0,0,7); cx.fill();
    // 머리
    cx.fillStyle=MAIN;
    cx.beginPath(); cx.arc(x-13*s,yb-17*s,7*s,0,7); cx.fill(); cx.stroke();
    // 주둥이
    cx.fillStyle=DARK;
    cx.beginPath(); cx.ellipse(x-18*s,yb-15*s,4*s,3*s,0,0,7); cx.fill(); cx.stroke();
    // 귀
    cx.fillStyle=MAIN;
    cx.beginPath(); cx.moveTo(x-15*s,yb-23*s); cx.lineTo(x-13*s,yb-29*s); cx.lineTo(x-10*s,yb-23*s); cx.closePath(); cx.fill(); cx.stroke();
    // 눈
    cx.fillStyle='#FFD9A0'; cx.beginPath(); cx.arc(x-14*s,yb-19*s,1.8*s,0,7); cx.fill();
    cx.fillStyle=OUT; cx.beginPath(); cx.arc(x-14.6*s,yb-19*s,0.9*s,0,7); cx.fill();
  }else if(e.sp==='fly'){
    const hov=Math.sin(W.t*4+e.bob)*5, wing=Math.sin(W.t*16+e.bob);
    const y2=yb-26*s+hov;
    // 날개
    cx.fillStyle=DARK;
    cx.beginPath(); cx.moveTo(x-3*s,y2-2*s);
    cx.quadraticCurveTo(x-14*s,y2-8*s-wing*8,x-18*s,y2+2*s-wing*10);
    cx.quadraticCurveTo(x-10*s,y2+4*s,x-3*s,y2+2*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.beginPath(); cx.moveTo(x+3*s,y2-2*s);
    cx.quadraticCurveTo(x+14*s,y2-8*s-wing*8,x+18*s,y2+2*s-wing*10);
    cx.quadraticCurveTo(x+10*s,y2+4*s,x+3*s,y2+2*s); cx.closePath(); cx.fill(); cx.stroke();
    // 몸
    cx.fillStyle=MAIN;
    cx.beginPath(); cx.ellipse(x,y2,7*s,8*s,0,0,7); cx.fill(); cx.stroke();
    // 귀/눈/송곳니
    cx.beginPath(); cx.moveTo(x-5*s,y2-6*s); cx.lineTo(x-3*s,y2-11*s); cx.lineTo(x-1*s,y2-6*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.beginPath(); cx.moveTo(x+1*s,y2-6*s); cx.lineTo(x+3*s,y2-11*s); cx.lineTo(x+5*s,y2-6*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.fillStyle='#FFD9A0'; cx.beginPath(); cx.arc(x-2.5*s,y2-1*s,1.6*s,0,7); cx.fill();
    cx.fillStyle=OUT; cx.beginPath(); cx.arc(x-3*s,y2-1*s,0.8*s,0,7); cx.fill();
  }else if(e.sp==='ghost'){
    const hov=Math.sin(W.t*3+e.bob)*4;
    const y2=yb-18*s+hov;
    cx.globalAlpha*=0.85;
    cx.fillStyle=MAIN;
    cx.beginPath();
    cx.arc(x,y2-6*s,10*s,Math.PI,0);
    const wob=W.t*6+e.bob;
    cx.lineTo(x+10*s,y2+6*s);
    for(let i=0;i<4;i++) cx.quadraticCurveTo(x+7.5*s-i*5*s,y2+10*s+Math.sin(wob+i)*3,x+5*s-i*5*s,y2+6*s);
    cx.closePath(); cx.fill(); cx.stroke();

    cx.beginPath(); cx.arc(x-4*s,y2-7*s,1.5*s,0,7); cx.fill();
    cx.beginPath(); cx.arc(x+2*s,y2-7*s,1.5*s,0,7); cx.fill();
    cx.beginPath(); cx.ellipse(x-1*s,y2-2*s,1.6*s,2.4*s,0,0,7); cx.fill();
    // 도깨비불
    cx.save(); cx.globalCompositeOperation='lighter';
    cx.fillStyle='rgba(140,200,255,'+(0.3+Math.sin(W.t*5)*0.15)+')';
    cx.beginPath(); cx.arc(x+13*s,y2-12*s+Math.sin(W.t*4)*3,3*s,0,7); cx.fill();
    cx.restore();
  }else if(e.sp==='und'){
    const shf=Math.sin(W.t*6+e.bob)*0.06;
    cx.save(); cx.translate(x,yb-12*s); cx.rotate(shf); cx.translate(-x,-(yb-12*s));
    // 다리뼈
    cx.strokeStyle=hit?'#FFF':'#D8D4C8'; cx.lineWidth=2.8*s;
    cx.beginPath(); cx.moveTo(x-4*s,yb-10*s); cx.lineTo(x-5*s,yb-1); cx.stroke();

    // 수의(넝마)
    cx.fillStyle=MAIN;
    cx.beginPath(); cx.moveTo(x-9*s,yb-22*s);
    cx.lineTo(x+9*s,yb-22*s); cx.lineTo(x+7*s,yb-8*s);
    for(let i=0;i<3;i++) cx.lineTo(x+5*s-i*5*s,yb-11*s+((i%2)*4*s));
    cx.lineTo(x-7*s,yb-8*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.fillStyle=DARK; cx.fillRect(x-7*s,yb-21*s,5*s,10*s);
    // 해골
    cx.fillStyle=hit?'#FFF':'#E8E4D8';
    cx.beginPath(); cx.arc(x,yb-28*s,7*s,0,7); cx.fill(); cx.stroke();
    cx.fillStyle=OUT;
    cx.beginPath(); cx.arc(x-3*s,yb-29*s,1.8*s,0,7); cx.fill();
    cx.beginPath(); cx.arc(x+3*s,yb-29*s,1.8*s,0,7); cx.fill();
    cx.fillRect(x-3*s,yb-23.5*s,6*s,1.2*s);
    // 팔 (내밀기)
    const arm2=e.lunge>0?-0.3+Math.sin(e.lunge*Math.PI)*0.9:0.2;
    cx.save(); cx.translate(x-8*s,yb-19*s); cx.rotate(arm2);

    cx.restore();
    cx.restore();
  }else if(e.sp==='serp'){

    for(let i=5;i>=0;i--){

    cx.beginPath(); cx.ellipse(x-4*s,hy,10*s,7.5*s,0,0,7); cx.fill(); cx.stroke();

    cx.beginPath(); cx.moveTo(x-6*s,hy-7*s); cx.lineTo(x-9*s,hy-14*s); cx.stroke();
    cx.beginPath(); cx.moveTo(x-2*s,hy-7*s); cx.lineTo(x-1*s,hy-13*s); cx.stroke();
    cx.strokeStyle=OUT; cx.lineWidth=1.4*s;
    cx.beginPath(); cx.moveTo(x-13*s,hy+1*s); cx.quadraticCurveTo(x-19*s,hy+2*s+Math.sin(W.t*6)*2,x-21*s,hy-2*s); cx.stroke();
    // 눈
    cx.fillStyle='#FFD9A0'; cx.beginPath(); cx.arc(x-8*s,hy-2*s,2*s,0,7); cx.fill();
    cx.fillStyle=OUT; cx.beginPath(); cx.arc(x-8.8*s,hy-2*s,1*s,0,7); cx.fill();
  }
  cx.restore();
  // 결빙 표시 — 얼음 결정에 갇힘
  if(e.frozen>0){

      cx.closePath(); cx.fill(); cx.stroke();
    }
  }
  cx.restore();
  // 체력바
  if(!e.boss&&e.state!=='die'){
    const w2=44,hp=Math.max(0,e.hp/e.maxhp);

    cx.fillStyle='#C05040'; cx.fillRect(e.x-w2/2+1,G-SZ-19,(w2-2)*hp,3);
    cx.font='10px sans-serif'; cx.fillStyle='rgba(255,240,220,.7)';
    cx.fillText((e.el?ELS[e.el].e+' ':'')+e.nm,e.x-w2/2,G-SZ-24);
  }
}
/* ── 수호 영물 ── */
function drawSpirit(){
  const sp=SPIRITS[S.spEq]; if(!sp) return;
  const h=W.hero;
  const dashP=W.spirit.dash;
  let sx=h.x-30, sy=W.G-72+Math.sin(W.spirit.bob*3)*5;
  if(dashP>0){
    const k=1-Math.abs(dashP-0.5)*2;
    sx=sx+(W.spirit.dashX-sx)*k; sy=sy+(W.G-46-sy)*k;
    cx.save(); cx.globalCompositeOperation='lighter';
    cx.fillStyle='rgba(159,232,192,.4)';
    cx.beginPath(); cx.arc(sx-8,sy+2,5,0,7); cx.fill();
    cx.restore();
  }
  const c=sp.c, OUT='#12100C', s=1+SPIRITS[S.spEq].r*0.12;
  cx.save(); cx.strokeStyle=OUT; cx.lineWidth=1.8;
  if(sp.body==='bird'){
    const wf=Math.sin(W.t*14)*5;
    cx.fillStyle=c;
    cx.beginPath(); cx.moveTo(sx,sy); cx.quadraticCurveTo(sx+8*s,sy-8*s-wf,sx+13*s,sy-2*s-wf); cx.quadraticCurveTo(sx+7*s,sy+3*s,sx,sy+1*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.beginPath(); cx.ellipse(sx,sy,6.5*s,5*s,0,0,7); cx.fill(); cx.stroke();
    cx.fillStyle='#E8B23E'; cx.beginPath(); cx.moveTo(sx-6*s,sy-1); cx.lineTo(sx-10*s,sy); cx.lineTo(sx-6*s,sy+1.6); cx.closePath(); cx.fill();
    cx.fillStyle=OUT; cx.beginPath(); cx.arc(sx-3.4*s,sy-1.4*s,0.9,0,7); cx.fill();
  }else if(sp.body==='cat'){
    cx.fillStyle=c;
    cx.beginPath(); cx.ellipse(sx,sy,7*s,5.6*s,0,0,7); cx.fill(); cx.stroke();
    cx.beginPath(); cx.moveTo(sx-5*s,sy-4*s); cx.lineTo(sx-4*s,sy-8*s); cx.lineTo(sx-1.6*s,sy-4.6*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.beginPath(); cx.moveTo(sx+1*s,sy-4.6*s); cx.lineTo(sx+3*s,sy-8*s); cx.lineTo(sx+4.6*s,sy-4*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.fillStyle=OUT; cx.beginPath(); cx.arc(sx-2.6*s,sy-1*s,0.9,0,7); cx.fill();
    cx.strokeStyle='rgba(20,16,12,.5)'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(sx+2*s,sy-3*s); cx.lineTo(sx+4*s,sy-4.4*s); cx.stroke();
  }else if(sp.body==='fox'){
    cx.fillStyle=c;
    cx.beginPath(); cx.quadraticCurveTo(sx+9*s,sy-9*s+Math.sin(W.t*4)*2,sx+14*s,sy-1*s);
    cx.quadraticCurveTo(sx+9*s,sy+4*s,sx+4*s,sy+1*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.beginPath(); cx.ellipse(sx,sy,7*s,5.2*s,0,0,7); cx.fill(); cx.stroke();
    cx.beginPath(); cx.moveTo(sx-6*s,sy-3.6*s); cx.lineTo(sx-4.6*s,sy-8.6*s); cx.lineTo(sx-2*s,sy-4.4*s); cx.closePath(); cx.fill(); cx.stroke();
    cx.fillStyle='#F5EBDC'; cx.beginPath(); cx.ellipse(sx-5.4*s,sy+0.6*s,2.6*s,2*s,0,0,7); cx.fill();
    cx.fillStyle=OUT; cx.beginPath(); cx.arc(sx-3.4*s,sy-1.4*s,0.9,0,7); cx.fill();
  }else{ // serp
    for(let i=3;i>=0;i--){
      const bx=sx+i*5.5*s, by=sy+Math.sin(W.t*6-i)*3;
      cx.fillStyle=i%2?'#2C5A74':c;
      cx.beginPath(); cx.arc(bx,by,(4.6-i*0.7)*s,0,7); cx.fill(); cx.stroke();
    }
    cx.strokeStyle='#E8DDC0'; cx.lineWidth=1.4;
    cx.beginPath(); cx.moveTo(sx-1,sy-4*s); cx.lineTo(sx-3,sy-8*s); cx.stroke();
    cx.fillStyle='#FFD9A0'; cx.beginPath(); cx.arc(sx-2*s,sy-1*s,1.1,0,7); cx.fill();
  }
  cx.restore();
}

const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];

function updateSceneUI(){

  $('killsV').textContent=W.mode==='dungeon'?'정벌':W.mode==='boss'?'보스전':frontier?S.kills+'/8':'정복';

function updateStat(){
  if(S.growView===1){
    if(!$('glv')) return;
    $('glv').textContent=S.lv;
    $('gexp').style.width=Math.min(100,S.exp/expNeed(S.lv)*100)+'%';
    $('gexpTxt').textContent='경험 '+fmt(S.exp)+' / '+fmt(expNeed(S.lv));
    $('gsp').textContent=S.sp;
    SPST.forEach((c,i)=>{
      const el=$('splv'+i); if(!el) return;
      el.textContent=S.spSt[c.id]+'성';
      $('spbtn'+i).classList.toggle('off',S.sp<1);
    });
    return;
  }
  STATS.forEach((c,i)=>{
    const el=$('stlv'+i); if(!el) return;
    const lv=S.st[c.id], maxed=c.max&&lv>=c.max;
    el.textContent=lv+'강'+(maxed?' (최대)':'');
    $('stvv'+i).textContent=c.fm(c.f(lv));
    const k=S.buyMode===3?Math.max(statMaxBuy(c.id),1):[1,10,100][S.buyMode];
    const kk=c.max?Math.min(k,c.max-lv):k;
    $('stsub'+i).textContent=maxed?'':('다음: '+c.fm(c.f(lv+kk)));
    const btn=$('stbtn'+i);
    if(maxed){ btn.textContent='완성'; btn.classList.add('off'); return; }
    const cost=statCost(c.id,kk);
    btn.innerHTML='+'+kk+'강<b>'+fmt(cost)+'냥</b>';
    btn.classList.toggle('off',S.gold<cost||kk<1);
  });
}
function buyStat(i){
  const c=STATS[i]; const lv=S.st[c.id];
  if(c.max&&lv>=c.max) return;
  let k=S.buyMode===3?Math.max(statMaxBuy(c.id),1):[1,10,100][S.buyMode];
  if(c.max) k=Math.min(k,c.max-lv);
  if(k<1) return;
  const cost=statCost(c.id,k);
  if(S.gold<cost) return;
  S.gold-=cost; S.st[c.id]+=k; if(S.dq) S.dq.ups+=k;
  updateStat(); updateHeader();
}
function spBuy(i){
  if(S.sp<1) return;
  S.sp--; S.spSt[SPST[i].id]++;
  if(S.dq) S.dq.ups++;
  updateStat(); updateHeader();
}

function equipAc(i){ if(!S.accs[i]) return; S.accEq=i; snd('reward'); buildEquip(); updateHeader(); }
function compUp(i){
  if(!compUnlocked(i)) return;
  const cost=compCost(i);
  if(S.gold<cost) return;
  S.gold-=cost; S.comp[i]=compLv(i)+1;
  const el=$('complv'+i), btn=$('compbtn'+i);
  if(el) el.textContent=compLv(i)+'성';
  if(btn) btn.innerHTML='+1성<b>'+fmt(compCost(i))+'냥</b>';
  updateHeader();
}
function equipW(i){ if(!S.weapons[i]) return; S.wEq=i; equipFx(WEAPONS[i].n+' 장착!'); buildEquip(); updateHeader(); }
function equipSp(i){ if(!S.spirits[i]) return; S.spEq=i; equipFx(SPIRITS[i].n+' 동행!'); buildEquip(); updateHeader(); }
function fuseW(){
  // 가장 낮은 등급부터: 같은 등급 내 레벨 합 5 → 상위 1 (신화 5 → 불멸 「파천황 어검」)
  for(let r=0;r<6;r++){
    const ids=WEAPONS.map((w2,i)=>({w2,i})).filter(o=>o.w2.r===r&&(S.weapons[o.i]||0)>0);
    let total=ids.reduce((a,o)=>a+S.weapons[o.i],0);
    if(total>=6||(r===5&&total>=5)){ // 최소 1레벨은 남김(장착 보전), 신화는 5로 불멸
      let need=5;
      for(const o of ids){
        if(need<=0) break;
        const take=Math.min(S.weapons[o.i]-(r<5?1:0),need);
        if(take>0){ S.weapons[o.i]-=take; need-=take;
          if(S.weapons[o.i]<=0){ delete S.weapons[o.i];
            if(S.wEq===o.i){ const ks=Object.keys(S.weapons); S.wEq=ks.length?+ks[0]:-1; } } }
      }
      if(need>0){ toast('⚒️ 합성 재료가 부족하오'); return; }
      let ni;
      if(r===5) ni=24; // 불멸 — 파천황 어검
      else{ const pool=WEAPONS.map((w2,i)=>({w2,i})).filter(o=>o.w2.r===r+1); ni=pool[Math.floor(Math.random()*pool.length)].i; }
      S.weapons[ni]=(S.weapons[ni]||0)+1; S.fuses++;
      snd('reward'); toast('⚒️ 합성 성공! '+WEAPONS[ni].n+' 획득');
      buildEquip(); updateHeader(); return;
    }
  }
  toast('⚒️ 합성 가능한 재료가 없소 (같은 등급 5레벨 + 여분 필요)');
}
function fuseSp(){
  for(let r=0;r<3;r++){
    const ids=SPIRITS.map((sp,i)=>({sp,i})).filter(o=>o.sp.r===r&&(S.spirits[o.i]||0)>0);
    let total=ids.reduce((a,o)=>a+S.spirits[o.i],0);
    if(total>=5){
      let need=4;
      for(const o of ids){
        if(need<=0) break;
        const take=Math.min(S.spirits[o.i]-1,need);
        if(take>0){ S.spirits[o.i]-=take; need-=take;
          if(S.spirits[o.i]<=0){ delete S.spirits[o.i];
            if(S.spEq===o.i){ const ks=Object.keys(S.spirits); S.spEq=ks.length?+ks[0]:-1; } } }
      }
      if(need>0){ toast('🔮 진화 재료가 부족하오'); return; }
      const pool=SPIRITS.map((sp,i)=>({sp,i})).filter(o=>o.sp.r===r+1);
      const ni=pool[Math.floor(Math.random()*pool.length)].i;
      S.spirits[ni]=(S.spirits[ni]||0)+1;
      snd('reward'); toast('🔮 진화 성공! '+SPIRITS[ni].n+' 획득');
      buildEquip(); updateHeader(); return;
    }
  }
  toast('🔮 진화 가능한 재료가 없소 (같은 등급 4레벨 + 여분 필요)');
}

function pull(kind,times){
  // 원작 가격: 장비/장신구/영물 50·500, 기술만 300·3000
  const cost=kind==='sk'?(times>=11?3000:300):(times>=11?500:50);
  if(S.jade<cost){ toast('비취가 부족하오'); return; }
  S.jade-=cost;
  const cnt=times>=11?12:1;
  S.summons+=cnt;
  if(!S.sumCnt) S.sumCnt={w:0,sk:0,sp:0,ac:0};
  S.sumCnt[kind]=(S.sumCnt[kind]||0)+cnt;
  if(S.dq) S.dq.sums+=cnt;
  if(S.wq) S.wq.sums+=cnt;
  const results=[];
  for(let t=0;t<cnt;t++){
    if(kind==='w'){
      const r=rollRar(RAR7);
      const pool=WEAPONS.map((w2,i)=>({w2,i})).filter(o=>o.w2.r===r);
      const pk=pool[Math.floor(Math.random()*pool.length)];
      S.weapons[pk.i]=(S.weapons[pk.i]||0)+1;
      results.push({e:pk.w2.e,n:pk.w2.n,rr:Math.min(r,6),rn:RAR7[r].n});
    }else if(kind==='sk'){
      const r=rollRar(RAR4);
      const pool=SKILLS.map((k,i)=>({k,i})).filter(o=>o.k.r===r);
      const pk=pool[Math.floor(Math.random()*pool.length)];
      S.skills[pk.i]=(S.skills[pk.i]||0)+1;
      results.push({e:pk.k.e,n:pk.k.n,rr:r===3?4:r===2?3:r,rn:RAR4[r].n});
    }else if(kind==='ac'){
      const r=rollRar(RAR4);
      const pool=ACCS.map((ac,i)=>({ac,i})).filter(o=>o.ac.r===r);
      const pk=pool[Math.floor(Math.random()*pool.length)];
      S.accs[pk.i]=(S.accs[pk.i]||0)+1;
      if(S.accEq<0) S.accEq=pk.i;
      results.push({e:pk.ac.e,n:pk.ac.n,rr:r===3?4:r===2?3:r,rn:RAR4[r].n});
    }else{
      const r=rollRar(RAR4);
      const pool=SPIRITS.map((sp,i)=>({sp,i})).filter(o=>o.sp.r===r);
      const pk=pool[Math.floor(Math.random()*pool.length)];
      S.spirits[pk.i]=(S.spirits[pk.i]||0)+1;
      if(S.spEq<0) S.spEq=pk.i;
      results.push({e:pk.sp.e,n:pk.sp.n,rr:r===3?4:r===2?3:r,rn:RAR4[r].n});
    }
  }
  snd('reward');
  let h='<h2>소환!</h2><div class="pullres">';
  results.forEach((r,idx)=>{
    h+=`<div class="rel r${r.rr}" style="animation-delay:${idx*0.07}s">
      <div class="e">${r.e}</div><div class="n">${r.n}</div><div class="v rar${r.rr}">${r.rn}</div></div>`;
  });
  h+='</div><button class="btn wide" data-a="close">거두기</button>';
  showModal(h);
  updateHeader();
}

  toast('🔁 반복 임무 완수! 비취 '+q.r+' (Lv.'+st.lv+')');

}

function weekKey(){

let lastFrame=performance.now(), uiAcc=0, saveAcc=0;

  let dt=(now-lastFrame)/1000; lastFrame=now;
  if(!(dt>0)) dt=0;      // 시계 역행·복귀 직후의 음수/NaN 방지
  if(dt>0.05) dt=0.05;
  update(dt);
  draw();
  uiAcc+=dt; saveAcc+=dt;
  if(uiAcc>=0.25){
    uiAcc=0;
    updateHeader(); updateSceneUI(); updateQuestHud();
    if(activeTab==='char') updateStat();
    else if(activeTab==='shop') updateShop();
  }
  if(saveAcc>=15){ saveAcc=0; save(); }
  requestAnimationFrame(frame);
}

'use strict';
/* ═══════════ 운영 연동 (조선 관제소) ═══════════
   서버(server.js)로 하트비트를 보내 접속 현황을 알리고,
   운영자 공지·우편(선물)·강제 퇴장·오류 보고를 처리한다.
   file:// 로 열면 조용히 비활성화된다. */
(function(){
  if(!/^https?:$/.test(location.protocol)) return;
  const PID = localStorage.joseon_ops_pid || (localStorage.joseon_ops_pid =
    Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,'0')).join(''));
  const TOWNS=['한양','평양','개성','전주','상주','나주','제주','수원','동래','의주'];
  const ROLES=['나그네','선비','한량','도령','낭자','포수','유생','장돌뱅이'];
  const NAME = localStorage.joseon_ops_name || (localStorage.joseon_ops_name =
    TOWNS[Math.floor(Math.random()*TOWNS.length)]+' '+ROLES[Math.floor(Math.random()*ROLES.length)]+' #'+PID.slice(0,4));
  const GAME='sword';
  let kicked=false, beatTimer=null;
  const shownMail=new Set();

  function stats(){
    try{
      if(!S) return null;
      return { top:S.maxClear+1, floor:S.stage, rank:RANKS[S.rank]||'무품', lv:S.lv,
        gold:S.gold, jade:S.jade, seok:S.seok, rebirths:S.rebirths, kills:S.kTotal, playMs:S.playMs };
    }catch(e){ return null; }
  }

  /* 우편 첨부 지급 — 게임의 소환/재화 로직과 동일한 방식 */
  function applyItem(it){
    const n=Math.max(1,Math.floor(+it.amt||1));
    switch(it.type){
      case 'gold': S.gold+=n; S.goldTotal+=n; return '냥 '+fmt(n);
      case 'jade': S.jade+=n; return '비취 '+fmt(n);
      case 'seok': S.seok+=n; return '영석 '+fmt(n);
      case 'box': {
        let g=0,j=0,sk=0;
        for(let i=0;i<n;i++){
          g+=Math.floor((500+Math.random()*1500)*Math.max(1,S.stage));
          j+=20+Math.floor(Math.random()*61); sk+=5+Math.floor(Math.random()*16);
        }
        S.gold+=g; S.goldTotal+=g; S.jade+=j; S.seok+=sk;
        return `보상 상자 ${n}개 → 냥 ${fmt(g)} · 비취 ${j} · 영석 ${sk}`;
      }
      case 'weapon': if(!WEAPONS[it.id]) return null;
        S.weapons[it.id]=(S.weapons[it.id]||0)+n; return WEAPONS[it.id].e+' '+WEAPONS[it.id].n+(n>1?' ×'+n:'');
      case 'skill': if(!SKILLS[it.id]) return null;
        S.skills[it.id]=(S.skills[it.id]||0)+n; return SKILLS[it.id].e+' '+SKILLS[it.id].n+(n>1?' ×'+n:'');
      case 'spirit': if(!SPIRITS[it.id]) return null;
        S.spirits[it.id]=(S.spirits[it.id]||0)+n;
        if(S.spEq<0) S.spEq=it.id;
        return SPIRITS[it.id].e+' '+SPIRITS[it.id].n+(n>1?' ×'+n:'');
      default: return null; /* 타 게임 전용 아이템은 무시 */
    }
  }
  function itemLabel(it){
    const n=it.amt>1?' ×'+fmt(it.amt):'';
    switch(it.type){
      case 'gold': return '💰 냥 '+fmt(it.amt);
      case 'jade': return '🟢 비취 '+fmt(it.amt);
      case 'seok': return '🔷 영석 '+fmt(it.amt);
      case 'box': return '🎁 보상 상자'+n;
      case 'weapon': return WEAPONS[it.id]?WEAPONS[it.id].e+' '+WEAPONS[it.id].n+n:null;
      case 'skill': return SKILLS[it.id]?SKILLS[it.id].e+' '+SKILLS[it.id].n+n:null;
      case 'spirit': return SPIRITS[it.id]?SPIRITS[it.id].e+' '+SPIRITS[it.id].n+n:null;
      default: return null;
    }
  }

  /* ── 우편함 오버레이 ── */
  let mailWrap=null, mailList=[];
  function ensureMailUI(){
    if(mailWrap) return;
    mailWrap=document.createElement('div');
    mailWrap.style.cssText='position:fixed;inset:0;background:rgba(22,17,12,.62);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px';
    mailWrap.innerHTML=`<div style="background:#F1E5C9;border:2px solid #C9B07C;border-radius:14px;max-width:400px;width:100%;max-height:78vh;overflow-y:auto;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.4)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b style="font-size:17px;color:#4A3823">📮 우편함</b>
        <button id="opsMailClose" style="background:none;border:none;font-size:18px;cursor:pointer;color:#6B5B42">✕</button>
      </div><div id="opsMailBody"></div></div>`;
    document.body.appendChild(mailWrap);
    mailWrap.querySelector('#opsMailClose').onclick=()=>{ mailWrap.style.display='none'; };
    mailWrap.addEventListener('click',e=>{ if(e.target===mailWrap) mailWrap.style.display='none'; });
  }
  function renderMail(){
    ensureMailUI();
    const body=mailWrap.querySelector('#opsMailBody');
    if(!mailList.length){ mailWrap.style.display='none'; return; }
    body.innerHTML=mailList.map(m=>`
      <div style="border:1px solid #C9B07C;border-radius:10px;padding:12px;margin-bottom:10px;background:#FBF4E4">
        <b style="color:#16110C">${m.title}</b>
        ${m.msg?`<div style="font-size:13px;color:#3A2F20;margin-top:5px;line-height:1.5">${m.msg}</div>`:''}
        <div style="font-size:13px;color:#4A3823;margin-top:7px">${m.items.map(itemLabel).filter(Boolean).join(' · ')||'(첨부 없음)'}</div>
        <button data-mid="${m.id}" class="opsClaim" style="margin-top:9px;background:#4A3823;color:#F2CE7B;border:none;border-radius:8px;padding:8px 20px;font-size:14px;cursor:pointer;width:100%">받 기</button>
      </div>`).join('');
    body.querySelectorAll('.opsClaim').forEach(b=>b.onclick=()=>claim(b.dataset.mid));
    mailWrap.style.display='flex';
  }
  function claim(mid){
    const m=mailList.find(x=>x.id===mid); if(!m) return;
    const got=m.items.map(applyItem).filter(Boolean);
    try{ save(); }catch(e){}
    toast(got.length?'📮 수령: '+got.join(', '):'📮 우편을 확인했습니다');
    mailList=mailList.filter(x=>x.id!==mid);
    fetch('/api/mail/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid:PID,mid})}).catch(()=>{});
    renderMail();
  }

  function onKick(){
    if(kicked) return; kicked=true;
    clearInterval(beatTimer);
    const d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;background:#16110C;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#F1E5C9;text-align:center;padding:24px';
    d.innerHTML='<div style="font-size:44px">🚫</div><div style="font-size:19px;font-weight:bold">관아의 명으로 접속이 중단되었습니다</div><div style="font-size:13px;color:#C9B07C">문의는 운영자에게 해주시오.</div>';
    document.body.appendChild(d);
  }

  async function beat(){
    if(kicked) return;
    try{
      const r=await fetch('/api/beat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({pid:PID,name:NAME,game:GAME,stats:stats()})});
      const d=await r.json();
      if(d.kick){ onKick(); return; }
      if(d.notices) d.notices.forEach(n=>toast('📢 '+n));
      if(d.mails){
        const fresh=d.mails.filter(m=>!shownMail.has(m.id));
        if(fresh.length){
          fresh.forEach(m=>shownMail.add(m.id));
          mailList=d.mails.slice();
          renderMail();
          toast('📮 우편이 도착했습니다!');
        }else{
          mailList=d.mails.slice();
        }
      }
    }catch(e){}
  }
  beat();
  beatTimer=setInterval(beat,5000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) beat(); });
  window.addEventListener('beforeunload',()=>{
    try{ navigator.sendBeacon('/api/bye',JSON.stringify({pid:PID})); }catch(e){}
  });

  /* ── 오류 보고 ── */
  let errSent=0, lastErr='';
  function reportErr(o){
    if(errSent>=15||o.msg===lastErr) return;
    errSent++; lastErr=o.msg;
    fetch('/api/error',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({pid:PID,name:NAME,game:GAME},o))}).catch(()=>{});
  }
  window.addEventListener('error',e=>reportErr({msg:e.message||'script error',src:e.filename,line:e.lineno,col:e.colno,stack:e.error&&e.error.stack||''}));
  window.addEventListener('unhandledrejection',e=>reportErr({msg:'Promise 거부: '+((e.reason&&e.reason.message)||String(e.reason)),stack:e.reason&&e.reason.stack||''}));
})();
</script>
</body>
</html>
